# Numeric leaves of `data` that are exempt from carrying a derivation handle
# (SB-07 §10 check 2c). `*` matches one JSON Pointer segment, `**` matches any
# number of them. Pointers are relative to `data`. Every entry states why the
# number is not a figure; a hostile reviewer should be able to read this file and
# see exactly what was exempted.
#
# Not present, deliberately: page-size and query-parameter echoes. This slice does
# not echo request parameters into `data`, so no pattern exempts them — if one is
# ever added it fails the walker until it is exempted here on purpose.
#
# An entry here is not free: `test_no_exemption_covers_a_served_figure` re-walks
# every served figure and fails if any pattern below would have covered one, so a
# broad pattern (`/**`) cannot be used to silence the walker.

# --- identifiers -------------------------------------------------------------
- pointer: /api10
  reason: Identifier. A 10-digit API number is an identity string, not a measurement.
- pointer: /*/api10
  reason: Identifier, in a collection item.
- pointer: /api14
  reason: Identifier. The completion-level API number.
- pointer: /state_code
  reason: FIPS-style state code carried as reported; an identifier, not a quantity.
- pointer: /basins/*/state_code
  reason: API state code on a per-basin summary row; an identifier, not a quantity.
- pointer: /county_code_at_permit
  reason: County code as reported at permit; an identifier, not a quantity.
- pointer: /*/county_code_at_permit
  reason: County code, in a collection item.
- pointer: /ndic_file_no
  reason: The NDIC file number is the regulator's identifier for the well.
- pointer: /cohorts/*/cohort_year
  reason: >-
    Cohort key. The year that identifies a cohort of wells; an identifier for the group, not
    a quantity measured about it. Which year it is - spud or completion anchor - is stated
    by cohort_basis and ruled by cohort_key_rule.
- pointer: /population_scope/states_served/*
  reason: >-
    API state prefix naming what this population covers; an identifier, not a quantity. Same
    class as /state_code.
- pointer: /*/ndic_file_no
  reason: The NDIC file number, in a collection item.

# --- coordinates -------------------------------------------------------------
- pointer: /surface_point/lon
  reason: Geometry, not a figure. Storage CRS is EPSG:4326 and is stated alongside.
- pointer: /surface_point/lat
  reason: Geometry, not a figure. Storage CRS is EPSG:4326 and is stated alongside.

# --- counts and shares -------------------------------------------------------
- pointer: /lateral_count
  reason: A count of geometry rows, not a measured quantity.
- pointer: /total
  reason: Row count of the quarantine population being summarised.
- pointer: /groups/*/count
  reason: Row count per group.
- pointer: /groups/*/share
  reason: Count divided by count; it carries no unit and no vintage.
- pointer: /support_distribution/classes/*
  reason: >-
    How many cohorts fall in each support band. A count of rows in this response, taken over
    figures that each carry their own handle, not a measured quantity of its own.
- pointer: /occurrence_count
  reason: How many fetches re-presented this rejected row (SB-07 §8.1).
- pointer: /*/occurrence_count
  reason: Occurrence counter, in a collection item.
- pointer: /sources/*/manifest_count
  reason: Count of registered manifests per source on the health page.
- pointer: /datasets/*/metrics/*/value
  reason: >-
    Operational inventory from a timed status snapshot; its grain, precision and observation
    time are stated alongside.
- pointer: /platform/schema_version
  reason: Database migration identity, not a measured petroleum quantity.
- pointer: /platform/database_bytes
  reason: Physical PostgreSQL storage inventory, not a petroleum figure.
- pointer: /*/alias_count
  reason: Reference-row cardinality, not a measured or modelled petroleum figure.
- pointer: /neighbors/*/neighbor_api10
  reason: API-10 identifier on a physical-neighbour row, not a measurement.
- pointer: /*/output_rows
  reason: >-
    Rows a derivation recorded when it wrote its output, in the derivation
    collection. Same class as /output/rows on the expanded record.
- pointer: /entries/*/n_words
  reason: Token count the highlighter uses to build its trie (SB-04 §6.2).

# --- spine metadata ----------------------------------------------------------
- pointer: /error_codes/*/status
  reason: An HTTP status code in the error index.
- pointer: /status
  reason: An HTTP status code on the error-type description.
- pointer: /chains/*/depth
  reason: Graph depth of the resolved chain, not data.
- pointer: /chains/*/nodes/*/output/rows
  reason: Row count a derivation recorded when it wrote its output.
- pointer: /chains/*/nodes/*/bytes
  reason: Byte length of the fetched artifact, recorded on the manifest.
- pointer: /output/rows
  reason: Row count a derivation recorded when it wrote its output.
- pointer: /duration_ms
  reason: Wall-clock cost of the recorded derivation.
- pointer: /inputs/*/ord
  reason: Ordinal position of a derivation input.
- pointer: /rules/*/applied_rows
  reason: How many rows a conformance rule touched during that derivation.
- pointer: /applied_by/*/applied_rows
  reason: Reverse index of rows touched, per citing derivation.
- pointer: /bytes
  reason: Byte length of the fetched artifact, recorded on the manifest.
- pointer: /*/bytes
  reason: Byte length, in a manifest collection item.

- pointer: /producing_window/months
  reason: >-
    Length of the producing window in months, read from cr_producing_window_1. A
    parameter of the classing, not an observation it stands behind.

# --- verbatim registry and rejected input ------------------------------------
- pointer: /params/**
  reason: >-
    The recorded call a derivation was made with, served verbatim from
    lineage.derivations. Its numbers are run inputs — EPSG codes, bounds, thresholds
    — and they are part of the derivation's content address, not an observation it
    stands behind. Same class as /spec/**.
- pointer: /output/partition/**
  reason: >-
    The partition key a derivation wrote its output under, served verbatim from
    lineage.derivations. It is part of the derivation's content address — a state
    API prefix, a source id, a vintage — not an observation it stands behind. Same
    class as /params/**.
- pointer: /spec/**
  reason: >-
    Conformance-rule spec, served verbatim from the registry. Its numbers are rule
    parameters (scales, factors, bounds), not served figures.
- pointer: /*/spec/**
  reason: Conformance-rule spec, in a collection item.
- pointer: /row_payload/**
  reason: >-
    The rejected source row, served verbatim as evidence (SB-07 §8). It is the input
    that failed a rule, not a number the system stands behind.
