# The scheduler runs as OS root and connects over the unix socket. There is no PostgreSQL
# role named root and this project does not create one, so peer authentication needs a map.
#
# The second line is not decoration. Naming a map on a pg_hba line removes PostgreSQL's
# implicit self-mapping for that rule, so without a regex self-map the glasswell, postgres
# and martin identities would stop authenticating the moment the map is placed.
#
# MAPNAME     SYSTEM-USERNAME   PG-USERNAME
glasswell     root              glasswell_scheduler
glasswell     /^(.*)$           \1
