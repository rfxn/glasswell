# SB-06 §1.3 / §2.3 sizing, against the 8 GiB balloon floor rather than the 16 GiB ceiling.
# NOT installed by default: applying it needs a PostgreSQL restart, which interrupts the
# running martin.service. `install.sh --with-postgres` places it; see infra/README.md.

shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB
max_connections = 60
superuser_reserved_connections = 3
full_page_writes = on
random_page_cost = 1.1
effective_io_concurrency = 200

# listen_addresses is deliberately NOT set here. The running value is 'localhost' and
# martin.service reaches PostgreSQL over loopback TCP; SB-06 §1.3's '' would take tiles
# down. Closing that gap means moving martin to the socket first (infra-exec-report D-7).
