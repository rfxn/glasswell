# Sized for VM 111 as it runs: 8 vCPU, 16 GiB resident, PGDATA on the ssd-pool.
# Allocations assume the 8 GiB balloon floor is reachable; planner hints assume the 16 GiB
# the guest has never dropped below. infra/README.md carries the arithmetic per setting.
# NOT installed by default: applying it needs a PostgreSQL restart, which interrupts the
# running martin.service. `install.sh --with-postgres` places it; see infra/README.md.

shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
autovacuum_work_mem = 256MB
work_mem = 64MB
temp_buffers = 64MB
max_connections = 80
superuser_reserved_connections = 3

# PGDATA is on the ssd-pool; /data (hdd-pool) holds no relation file.
random_page_cost = 1.1
effective_io_concurrency = 200

# A bulk promotion writes ~12 GB of relation data and the stock 1GB max_wal_size
# re-arms full-page writes against six indexes on every checkpoint it forces.
full_page_writes = on
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB   # sighup-reloadable: the NM promotion runbook raises it for the run
checkpoint_timeout = 15min

# Four workers plus the leader is blueprint C26's five-of-eight-vCPU cap for batch work.
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

default_statistics_target = 200

# canonical.* cannot UPDATE (lineage.reject_mutation), so insert-driven freezing and analyze
# staleness are its risks, not bloat; marts.*_tile churn a whole generation every refresh.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# listen_addresses is deliberately NOT set here. The running value is 'localhost' and
# martin.service reaches PostgreSQL over loopback TCP; SB-06 §1.3's '' would take tiles
# down. Closing that gap means moving martin to the socket first (infra-exec-report D-7).
