# A drop-in, not a unit: martin.service belongs to the host and predates this directory.
# Pointing martin at a config file turns auto_publish off, which is what stops the tile server
# publishing staging and canonical relations (DR-05, blueprint 3.0.1). The config carries the
# listen address, so no tile-source flag may be passed alongside --config.
#
# Requires migration 026: the config's DSN names no user and peer-auths as the OS user, so the
# PG role `martin` must exist first or the pool cannot be created.
[Service]
ExecStart=
ExecStart=/usr/local/bin/martin --config /etc/martin/config.yaml
