# The directory Caddy reaches the API through. glasswell binds and owns the socket; caddy
# gets the group so it can traverse; 0750 keeps every other local user out, which matters
# because uvicorn chmods the socket itself to 0666 and offers no way to change that.
#
# Not a RuntimeDirectory= on glasswell-api.service: systemd re-applies exec-directory
# ownership on each exec invocation, so a chgrp from ExecStartPre is reverted before ExecStart.
# systemd leaves a tmpfiles-owned directory alone.
d /run/glasswell 0750 glasswell caddy -
