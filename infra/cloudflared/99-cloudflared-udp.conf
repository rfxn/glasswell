# cloudflared asks for a 7 MiB UDP receive buffer and logs
# "failed to sufficiently increase receive buffer size" against the 208 KiB default at every
# start. The default leaves QUIC with no headroom to absorb a burst, which turns ordinary
# link loss into a dropped connection. Sized to what quic-go asks for, not above it.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
