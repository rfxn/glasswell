# The DSN deliberately names no user: pg_hba maps a socket connection to the role named for
# the OS user, martin.service runs `User=martin`, and migration 020 creates that role with
# select on exactly the columns declared below. Adopting this file turns auto_publish off,
# which is what stops martin serving staging and canonical (README.md, DR-05).
listen_addresses: "127.0.0.1:3000"
postgres:
  connection_string: "postgresql:///glasswell?host=/var/run/postgresql"
  pool_size: 10
  auto_publish: false
  tables:
    nd_laterals:
      schema: marts
      table: nd_laterals_tile
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      properties:
        api10: text
        linekey: text
        operator_name: text
        status_canonical: text
        spud_year: int4
        lateral_length_ft: float8
        derivation_id: text
    nd_wells:
      schema: marts
      table: nd_wells_tile
      srid: 4326
      geometry_column: geom
      geometry_type: POINT
      properties:
        api10: text
        operator_name: text
        status_canonical: text
        spud_year: int4
        derivation_id: text
    nd_spacing_units:
      schema: marts
      table: nd_spacing_units_tile
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      properties:
        spacing_unit_id: text
        label: text
        formation_reported: text
        ds_size_acres: float8
        derivation_id: text
