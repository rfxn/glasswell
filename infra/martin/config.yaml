# The DSN deliberately names no user: pg_hba maps a socket connection to the role named for
# the OS user, martin.service runs `User=martin`, and migration 026 creates that role with
# select on the marts.tile_* views. Adopting this file turns auto_publish off; the grant is
# what makes staging unreachable either way (README.md, DR-05).
#
# The sources are the tile *functions*, not the views beneath them. The functions read those
# same views, so the publication boundary is unchanged — and they carry the materialised CTE
# and the zoom-proportional ST_Simplify, which a table source cannot: it has no z to key a
# tolerance on. Measured on VM 111, table sources cost +21% bytes at z7 and +42% at z11 on
# nd_laterals. One mechanism at a time: `tables:` here would collide on these same ids.
listen_addresses: "127.0.0.1:3000"
postgres:
  connection_string: "postgresql:///glasswell?host=/var/run/postgresql"
  pool_size: 10
  auto_publish: false
  functions:
    nd_laterals:
      schema: marts
      function: nd_laterals
    nd_wells:
      schema: marts
      function: nd_wells
    nd_spacing_units:
      schema: marts
      function: nd_spacing_units
    nd_survey_traces:
      schema: marts
      function: nd_survey_traces
    land_townships:
      schema: marts
      function: land_townships
    land_sections:
      schema: marts
      function: land_sections
    land_township_metrics:
      schema: marts
      function: land_township_metrics
    land_section_metrics:
      schema: marts
      function: land_section_metrics
    tx_laterals:
      schema: marts
      function: tx_laterals
    tx_wells:
      schema: marts
      function: tx_wells
