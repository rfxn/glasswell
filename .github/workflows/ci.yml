name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A PR ref supersedes itself: a fix push cancels the run it replaces. A push to main does not --
# every tree that lands on main gets its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
      collateral: ${{ steps.filter.outputs.collateral }}
      covered: ${{ steps.covered.outputs.covered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Any uncertainty answers "run it": an unreachable base, a force push, a first push.
      # The unit tier is not filtered at all -- it reads CHANGELOG.md, VERSION, infra/ and
      # scripts/, so no diff is provably outside it, and it costs 43 s.
      - name: Classify the diff
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          run_all() { printf '%s=true\n' db web shell collateral >> "$GITHUB_OUTPUT"; exit 0; }
          case "$BASE" in ''|0000000000000000000000000000000000000000) run_all ;; esac
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || run_all  # base pruned or rewritten
          range="${BASE}..HEAD"
          [ "$EVENT" = pull_request ] && range="${BASE}...HEAD"
          git diff --name-only "$range" > changed.txt
          match() { grep -qE "$1" changed.txt && echo true || echo false; }
          db=$(match '^(src/|tests/(contract|integration|support|fixtures)/|requirements\.lock$|Makefile$|\.github/workflows/)')
          # A release commit's only pyproject edit is the version string, and no test reads it.
          if [ "$db" = false ] && grep -qx 'pyproject.toml' changed.txt; then
            other=$(git diff "$range" -- pyproject.toml | grep -E '^[+-][^+-]' | grep -cvE '^[+-][[:space:]]*version[[:space:]]*=' || true)  # grep -c exits 1 on zero
            [ "${other:-0}" -gt 0 ] && db=true
          fi
          {
            printf 'db=%s\n'         "$db"
            printf 'web=%s\n'        "$(match '^(web/|tests/e2e/|\.github/workflows/)')"
            printf 'shell=%s\n'      "$(match '^(infra/|scripts/|.*\.sh$|\.github/workflows/)')"
            printf 'collateral=%s\n' "$(match '^(assets/|changelog\.d/|docs/|blueprints/|scripts/(changelog-assemble|render-changelog)\.py$|.*\.md$|\.github/workflows/)')"
          } >> "$GITHUB_OUTPUT"

      # A merge commit whose tree equals a parent's tree IS that parent's tree. ci.yml is part
      # of the tree, so a green run on that parent is a green run of this workflow on this
      # content. Push events only: a pull_request merge ref has no such parent.
      - name: Is this tree already green
        id: covered
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          printf 'covered=false\n' >> "$GITHUB_OUTPUT"
          [ "$EVENT" = push ] || exit 0
          tree=$(git rev-parse 'HEAD^{tree}')
          for parent in $(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-); do
            [ "$(git rev-parse "${parent}^{tree}")" = "$tree" ] || continue
            green=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${parent}&status=success" --jq '.total_count' 2>/dev/null || echo 0)  # any API failure runs the gate
            if [ "${green:-0}" -gt 0 ]; then
              printf 'covered=true\n' >> "$GITHUB_OUTPUT"
              printf '::notice::tree %s already green at %s\n' "${tree:0:12}" "${parent:0:12}"
              exit 0
            fi
          done

  python-lint:
    name: Python — ruff, the tile allowlist and the unit tier
    needs: changes
    if: needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # test_release_tooling's evidence probe skips on a shallow clone

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the recorded environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: ruff
        run: python -m ruff check .

      # DR-05: the tile allowlist the proxy enforces and the function list martin is configured
      # to publish must be the same set. It fails fast without a database, so it keeps a step of
      # its own and cannot be lost in a tier's total.
      - name: martin config equals the tile allowlist
        run: python -m pytest -q tests/unit/test_martin_config.py

      # Sharding's own failure mode is a file that falls into no shard and silently stops
      # running. The union of the four groups must equal the whole DB collection.
      - name: Shard parity — the union of the four groups is the suite
        run: |
          set -euo pipefail
          total=$(python -m pytest tests/contract tests/integration -q --collect-only | grep -c '^tests/')
          sum=0
          for group in 1 2 3 4; do
            n=$(python -m pytest tests/contract tests/integration -q --collect-only \
                  --splits 4 --group "$group" --durations-path tests/.durations.json | grep -c '^tests/')
            sum=$((sum + n))
          done
          printf 'shards collect %d of %d\n' "$sum" "$total"
          [ "$sum" -eq "$total" ]

      - name: Unit tier
        run: python -m pytest tests/unit -q -ra

  python-db:
    name: Python — contract and integration, shard ${{ matrix.group }}/4
    needs: changes
    if: needs.changes.outputs.db == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      GLASSWELL_REQUIRE_DOCKER: "1"
      PGSERVER: gw-ci-${{ github.run_id }}-${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the recorded environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      # One server per job, started here rather than once per xdist worker: worker teardown is
      # not guaranteed (measured: one container survived a -n 6 run), and a container the
      # workflow starts is a container the workflow removes.
      - name: Start the PostGIS server this job owns
        run: |
          set -euo pipefail
          docker volume create --label glasswell.test=1 "${PGSERVER}-data"
          docker run -d --name "$PGSERVER" --label glasswell.test=1 \
            -v "${PGSERVER}-data:/var/lib/postgresql/data" \
            -e POSTGRES_USER=glasswell -e POSTGRES_PASSWORD="$GITHUB_RUN_ID" -e POSTGRES_DB=postgres \
            postgis/postgis:16-3.4 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c wal_level=minimal -c max_wal_senders=0 -c max_wal_size=2GB -c checkpoint_timeout=30min
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$PGSERVER")
          printf 'GLASSWELL_TEST_SERVER_DSN=postgresql://glasswell:%s@%s:5432/{database}?connect_timeout=5&keepalives=1&keepalives_idle=10&keepalives_interval=5&keepalives_count=3&tcp_user_timeout=30000\n' \
            "$GITHUB_RUN_ID" "$ip" >> "$GITHUB_ENV"

      # -ra so a skip is named rather than counted: two mechanisms are known-inert in CI and a
      # third (test_martin_publishes without its image) would be a hole, not a skip.
      - name: Contract and integration tiers
        run: |
          set -euo pipefail
          python -m pytest tests/contract tests/integration -q -ra \
            -n 4 --dist loadfile \
            --splits 4 --group "${{ matrix.group }}" --durations-path tests/.durations.json

      - name: Remove the server this job started
        if: always()
        run: |
          docker rm -f "$PGSERVER" >/dev/null 2>&1 || true            # ephemeral runner; hygiene, not correctness
          docker volume rm -f "${PGSERVER}-data" >/dev/null 2>&1 || true  # same

  harness-hygiene:
    name: Python — the harness owns its storage
    needs: changes
    if: needs.changes.outputs.db == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    env:
      GLASSWELL_REQUIRE_DOCKER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the recorded environment
        run: |
          set -euo pipefail
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      # DR-25/N-10 asserts on the container the fixture starts, so this one file runs the
      # self-managed path the shards bypass -- GLASSWELL_TEST_SERVER_DSN is deliberately unset
      # here. Six tests, one container, serial.
      - name: Harness hygiene
        run: python -m pytest tests/integration/test_harness_hygiene.py -q -ra

  web:
    name: Web — vitest, tsc and the production build
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npx vitest run

      - name: tsc
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-guards:
    name: E2E — the browserless guard suite (tests/e2e/lib.test.mjs)
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # lib.mjs is the security boundary for every visual QA run; its guard tests must not
      # depend on a browser, an npm install or a deployed instance — and they do not:
      # playwright is imported lazily and never reached by lib.test.mjs.
      - name: node --test
        run: node --test tests/e2e

  shell:
    name: Shell — bash -n and shellcheck on everything that ships
    needs: changes
    if: needs.changes.outputs.shell == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # infra/ and scripts/ run on the deploy host. A syntax error in verify.sh is found at
      # 2am otherwise, which is the hour it is always found at.
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d shell files\n' "${#files[@]}"
          bash -n "${files[@]}"
          shellcheck "${files[@]}"

  collateral:
    name: Collateral checks
    needs: changes
    if: needs.changes.outputs.collateral == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # gate-rel B1: a fragment outside the grammar used to survive the fold and only be
      # refused by the build that ran *after* the tag was cut. It fails the pull request now.
      # Same parser as the page and the release gate — one grammar, three callers.
      - name: changelog.d fragments and CHANGELOG.md parse
        run: |
          set -euo pipefail
          python3 scripts/changelog-assemble.py --lint
          python3 scripts/render-changelog.py --check

      - name: SVG well-formedness
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            xmllint --noout "$f" || { echo "MALFORMED: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: SVG accessibility metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            grep -q 'role="img"'   "$f" || { echo "missing role=img: $f";   FAIL=1; }
            grep -q 'aria-label='  "$f" || { echo "missing aria-label: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: Local links and image references resolve
        run: |
          set -uo pipefail
          FAIL=0
          while IFS= read -r md; do
            # markdown links, plus src= and srcset= in the inline HTML blocks
            refs=$(grep -oE '\]\([^)]+\)|src="[^"]+"|srcset="[^"]+"' "$md") || true  # grep exits 1 on no matches; a file with no links is not an error
            [ -z "$refs" ] && continue
            while IFS= read -r ref; do
              target=$(printf '%s' "$ref" \
                | sed -E 's/^\]\(//; s/\)$//; s/^srcset="//; s/^src="//; s/"$//; s/#.*$//')
              [ -z "$target" ] && continue
              # gw: is this product's own token-level link scheme (SB-05 §live data links),
              # so a document showing its form is not naming a file that should exist.
              case "$target" in
                http://*|https://*|mailto:*|gw:*) continue ;;
              esac
              if [[ "$target" = /* ]]; then
                resolved=".${target}"
              else
                resolved="$(dirname "$md")/${target}"
              fi
              if [ ! -e "$resolved" ]; then
                echo "BROKEN in $md: $target"
                FAIL=1
              fi
            done <<< "$refs"
          done < <(git ls-files '*.md')
          exit "$FAIL"

      - name: No AI-assistant attribution
        run: |
          set -euo pipefail
          if git grep -nEi 'co-authored-by:[[:space:]]*claude|generated with \[?claude|anthropic\.com/claude-code' -- . ; then
            echo "AI attribution found — remove before merge"
            exit 1
          fi
          exit 0

      # Blueprint 8.2 carve-out: the research corpus is git-excluded, so a name or a pointer
      # to it in source both leaks and dangles. The pattern has two halves held to different
      # rules — check which half a token belongs to before editing the list.
      #   Vendor names are capped at the ceiling the tracked blueprints set: a name may enter
      #   only if those documents already carry it, because naming one they do not is itself
      #   the leak this step exists to prevent.
      #   Structural patterns (peer-map-, docs/product-[a-z]) match the *shape* of a corpus
      #   pointer and name nobody, so the ceiling rule does not apply to them. They are the
      #   only vendor-free coverage here; do not delete them as unsupported by that rule.
      # Known blind spot: acronym-only references are out of scope. Short tokens collide with
      # petroleum vocabulary and with operator names in the public regulatory fixtures, and a
      # guard people learn to ignore is worse than none — so a green run means "clean of the
      # classes below", not "clean". That class needs review by eye; measured against the
      # scrub that added this step, the pattern caught 7 of 8 real sites.
      # `docs/product-[a-z]` is a real filename, so the `docs/product-*.md` glob that
      # SMOKE.md and infra/ deploy hygiene name still passes.
      - name: No IP carve-out material in tracked source
        run: |
          set -euo pipefail
          if git grep -nEi '\b(novi|enverus|combocurve|welldatabase|petroai)\b|petro\.ai|turing analytics|peer-map-|docs/product-[a-z]' \
              -- . ':!blueprint.md' ':!blueprint-v0.6-draft.md' ':!blueprints/' ':!.github/workflows/ci.yml' ; then
            echo "carve-out material found — state the property in glasswell's own voice instead"
            exit 1
          fi
          exit 0

  map-chrome:
    name: UI chrome — map fold and Status geometry
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.covered != 'true'
    runs-on: ubuntu-latest
    # Map rows come from the static registry and Status receives a mocked valid envelope, so
    # their geometry is a bundle property. This job needs no database, key, or deployed
    # instance. GLASSWELL_REQUIRE_E2E turns "no browser" into a failure, keeping the guard
    # from going inert.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      GLASSWELL_BASE_URL: http://127.0.0.1:8139
      GLASSWELL_REQUIRE_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the bundle
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build

      - name: Install playwright-core and the chromium it is matched to
        run: |
          set -euo pipefail
          npm --prefix tests/e2e ci --no-audit --no-fund
          tests/e2e/node_modules/.bin/playwright-core install --with-deps chromium
          chrome=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path '*/chrome-linux64/chrome' | head -1)
          [ -n "$chrome" ] || { echo "no chromium under $PLAYWRIGHT_BROWSERS_PATH"; exit 1; }
          printf 'GW_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"

      - name: Serve the bundle and measure the chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8139 --bind 127.0.0.1 --directory web/dist >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$GLASSWELL_BASE_URL/" >/dev/null && break
            sleep 1
          done
          curl -sf "$GLASSWELL_BASE_URL/" >/dev/null || { echo "static server never came up"; exit 1; }
          node tests/e2e/chrome-fold.mjs
          node tests/e2e/status-surface.mjs
          node tests/e2e/hidden-display.mjs

  # The one required status check. Every other job can be filtered out; this one always runs,
  # so a filtered PR reports a verdict instead of waiting forever for a check that never
  # arrives. Branch protection must be repointed to this context in the same change.
  ci:
    name: CI complete
    if: always()
    needs: [changes, python-lint, python-db, harness-hygiene, web, e2e-guards, shell, collateral, map-chrome]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad=$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then printf 'not green:\n%s\n' "$bad"; exit 1; fi
          echo "all green"
