name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — ruff and the full pytest suite (unit, integration, contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the recorded environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: ruff
        run: python -m ruff check .

      # DR-05: the tile allowlist the proxy enforces and the function list martin is configured
      # to publish must be the same set. Property types come from each function's select list,
      # so there is no second declaration to compare. This fails fast without a database.
      - name: martin config equals the tile allowlist
        run: >
          python -m pytest -q
          tests/integration/test_tile_wire_types.py::test_the_martin_config_publishes_the_functions_the_allowlist_names

      # The integration and contract tiers start their own PostGIS container through the
      # docker CLI, so no `services:` block applies here. The runner's daemon is local, so the
      # harness reaches it on the bridge IP; a remote daemon (anvil, `make test-anvil`) gets a
      # published port instead.
      # GLASSWELL_REQUIRE_DOCKER turns a missing daemon into a failure, not a silent skip.
      - name: pytest
        env:
          GLASSWELL_REQUIRE_DOCKER: "1"
        run: python -m pytest tests -q

  web:
    name: Web — vitest, tsc and the production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npx vitest run

      - name: tsc
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-guards:
    name: E2E — the browserless guard suite (tests/e2e/lib.test.mjs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # lib.mjs is the security boundary for every visual QA run; its guard tests must not
      # depend on a browser, an npm install or a deployed instance — and they do not:
      # playwright is imported lazily and never reached by lib.test.mjs.
      - name: node --test
        run: node --test tests/e2e

  shell:
    name: Shell — bash -n and shellcheck on everything that ships
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # infra/ and scripts/ run on the deploy host. A syntax error in verify.sh is found at
      # 2am otherwise, which is the hour it is always found at.
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d shell files\n' "${#files[@]}"
          bash -n "${files[@]}"
          shellcheck "${files[@]}"

  collateral:
    name: Collateral checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # gate-rel B1: a fragment outside the grammar used to survive the fold and only be
      # refused by the build that ran *after* the tag was cut. It fails the pull request now.
      # Same parser as the page and the release gate — one grammar, three callers.
      - name: changelog.d fragments and CHANGELOG.md parse
        run: |
          set -euo pipefail
          python3 scripts/changelog-assemble.py --lint
          python3 scripts/render-changelog.py --check

      - name: SVG well-formedness
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            xmllint --noout "$f" || { echo "MALFORMED: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: SVG accessibility metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            grep -q 'role="img"'   "$f" || { echo "missing role=img: $f";   FAIL=1; }
            grep -q 'aria-label='  "$f" || { echo "missing aria-label: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: Local links and image references resolve
        run: |
          set -uo pipefail
          FAIL=0
          while IFS= read -r md; do
            # markdown links, plus src= and srcset= in the inline HTML blocks
            refs=$(grep -oE '\]\([^)]+\)|src="[^"]+"|srcset="[^"]+"' "$md") || true  # grep exits 1 on no matches; a file with no links is not an error
            [ -z "$refs" ] && continue
            while IFS= read -r ref; do
              target=$(printf '%s' "$ref" \
                | sed -E 's/^\]\(//; s/\)$//; s/^srcset="//; s/^src="//; s/"$//; s/#.*$//')
              [ -z "$target" ] && continue
              # gw: is this product's own token-level link scheme (SB-05 §live data links),
              # so a document showing its form is not naming a file that should exist.
              case "$target" in
                http://*|https://*|mailto:*|gw:*) continue ;;
              esac
              if [ ! -e "$target" ]; then
                echo "BROKEN in $md: $target"
                FAIL=1
              fi
            done <<< "$refs"
          done < <(git ls-files '*.md')
          exit "$FAIL"

      - name: No AI-assistant attribution
        run: |
          set -euo pipefail
          if git grep -nEi 'co-authored-by:[[:space:]]*claude|generated with \[?claude|anthropic\.com/claude-code' -- . ; then
            echo "AI attribution found — remove before merge"
            exit 1
          fi
          exit 0

      # Blueprint 8.2 carve-out: the research corpus is git-excluded, so a name or a pointer
      # to it in source both leaks and dangles. The pattern has two halves held to different
      # rules — check which half a token belongs to before editing the list.
      #   Vendor names are capped at the ceiling the tracked blueprints set: a name may enter
      #   only if those documents already carry it, because naming one they do not is itself
      #   the leak this step exists to prevent.
      #   Structural patterns (peer-map-, docs/product-[a-z]) match the *shape* of a corpus
      #   pointer and name nobody, so the ceiling rule does not apply to them. They are the
      #   only vendor-free coverage here; do not delete them as unsupported by that rule.
      # Known blind spot: acronym-only references are out of scope. Short tokens collide with
      # petroleum vocabulary and with operator names in the public regulatory fixtures, and a
      # guard people learn to ignore is worse than none — so a green run means "clean of the
      # classes below", not "clean". That class needs review by eye; measured against the
      # scrub that added this step, the pattern caught 7 of 8 real sites.
      # `docs/product-[a-z]` is a real filename, so the `docs/product-*.md` glob that
      # SMOKE.md and infra/ deploy hygiene name still passes.
      - name: No IP carve-out material in tracked source
        run: |
          set -euo pipefail
          if git grep -nEi '\b(novi|enverus|combocurve|welldatabase|petroai)\b|petro\.ai|turing analytics|peer-map-|docs/product-[a-z]' \
              -- . ':!blueprint.md' ':!blueprint-v0.6-draft.md' ':!blueprints/' ':!.github/workflows/ci.yml' ; then
            echo "carve-out material found — state the property in glasswell's own voice instead"
            exit 1
          fi
          exit 0

  map-chrome:
    name: Map chrome — the layer panel's fold ratio (tests/e2e/chrome-fold.mjs)
    runs-on: ubuntu-latest
    # The panel's rows come from the static registry, so its geometry is a property of the
    # bundle and not of the data: the built bundle on a static server yields the same numbers
    # a serve_branch run does, and this job needs no database, no key and no deployed
    # instance. GLASSWELL_REQUIRE_E2E turns "no browser" and "instance predates the row
    # disclosure" from notes into failures, which is what keeps the guard from going inert.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      GLASSWELL_BASE_URL: http://127.0.0.1:8139
      GLASSWELL_REQUIRE_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the bundle
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build

      - name: Install playwright-core and the chromium it is matched to
        run: |
          set -euo pipefail
          npm --prefix tests/e2e ci --no-audit --no-fund
          tests/e2e/node_modules/.bin/playwright-core install --with-deps chromium
          chrome=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path '*/chrome-linux64/chrome' | head -1)
          [ -n "$chrome" ] || { echo "no chromium under $PLAYWRIGHT_BROWSERS_PATH"; exit 1; }
          printf 'GW_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"

      - name: Serve the bundle and measure the chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8139 --bind 127.0.0.1 --directory web/dist >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$GLASSWELL_BASE_URL/" >/dev/null && break
            sleep 1
          done
          curl -sf "$GLASSWELL_BASE_URL/" >/dev/null || { echo "static server never came up"; exit 1; }
          node tests/e2e/chrome-fold.mjs
