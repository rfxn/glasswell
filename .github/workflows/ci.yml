name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — ruff and the full pytest suite (unit, integration, contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the recorded environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: ruff
        run: python -m ruff check .

      # DR-05: the tile allowlist the proxy enforces and the source list martin is configured
      # to publish must be the same set, with the same property types. Needs no database, so
      # it fails fast and it fails even when the docker tier cannot start.
      - name: martin config equals the tile allowlist
        run: >
          python -m pytest -q
          tests/integration/test_tile_wire_types.py::test_the_martin_config_and_the_allowlist_declare_the_same_property_types

      # The integration and contract tiers start their own PostGIS container through the
      # docker CLI and reach it on the bridge IP, so no `services:` block applies here.
      # GLASSWELL_REQUIRE_DOCKER turns a missing daemon into a failure, not a silent skip.
      - name: pytest
        env:
          GLASSWELL_REQUIRE_DOCKER: "1"
        run: python -m pytest tests -q

  web:
    name: Web — vitest, tsc and the production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npx vitest run

      - name: tsc
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  shell:
    name: Shell — bash -n and shellcheck on everything that ships
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # infra/ and scripts/ run on the deploy host. A syntax error in verify.sh is found at
      # 2am otherwise, which is the hour it is always found at.
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d shell files\n' "${#files[@]}"
          bash -n "${files[@]}"
          shellcheck "${files[@]}"

  collateral:
    name: Collateral checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: SVG well-formedness
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            xmllint --noout "$f" || { echo "MALFORMED: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: SVG accessibility metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          FAIL=0
          for f in assets/*.svg; do
            grep -q 'role="img"'   "$f" || { echo "missing role=img: $f";   FAIL=1; }
            grep -q 'aria-label='  "$f" || { echo "missing aria-label: $f"; FAIL=1; }
          done
          exit "$FAIL"

      - name: Local links and image references resolve
        run: |
          set -uo pipefail
          FAIL=0
          while IFS= read -r md; do
            # markdown links, plus src= and srcset= in the inline HTML blocks
            refs=$(grep -oE '\]\([^)]+\)|src="[^"]+"|srcset="[^"]+"' "$md") || true  # grep exits 1 on no matches; a file with no links is not an error
            [ -z "$refs" ] && continue
            while IFS= read -r ref; do
              target=$(printf '%s' "$ref" \
                | sed -E 's/^\]\(//; s/\)$//; s/^srcset="//; s/^src="//; s/"$//; s/#.*$//')
              [ -z "$target" ] && continue
              case "$target" in
                http://*|https://*|mailto:*) continue ;;
              esac
              if [ ! -e "$target" ]; then
                echo "BROKEN in $md: $target"
                FAIL=1
              fi
            done <<< "$refs"
          done < <(git ls-files '*.md')
          exit "$FAIL"

      - name: No AI-assistant attribution
        run: |
          set -euo pipefail
          if git grep -nEi 'co-authored-by:[[:space:]]*claude|generated with \[?claude|anthropic\.com/claude-code' -- . ; then
            echo "AI attribution found — remove before merge"
            exit 1
          fi
          exit 0
