<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 970" width="1080" height="970" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="glasswell system architecture: public regulator files through a raw zone, staging, canonical and marts layers into an API, map and agent gateway, with an append-only audit stream">
  <rect x="1" y="1" width="1078" height="968" rx="14" fill="#FFFFFF" stroke="#D8E1E8" stroke-width="1"/>

  <text x="32" y="42" font-size="22" font-weight="700" fill="#0B1014">glass<tspan fill="#2A9BB5">well</tspan> &#8212; System Architecture</text>
  <text x="32" y="64" font-size="12.5" fill="#55666F">Staging never serves. Marts never ingest. Every served figure carries a derivation handle back to a checksummed file.</text>

  <g font-size="11" fill="#55666F">
    <rect x="32"  y="78" width="12" height="12" rx="2" fill="#EEF3F6" stroke="#9DAEB9"/><text x="50"  y="88">source / raw</text>
    <rect x="180" y="78" width="12" height="12" rx="2" fill="#F1F5F8" stroke="#8FA3B0"/><text x="198" y="88">staging (source-faithful)</text>
    <rect x="392" y="78" width="12" height="12" rx="2" fill="#E4F5F9" stroke="#2A9BB5"/><text x="410" y="88">canonical (conformed)</text>
    <rect x="596" y="78" width="12" height="12" rx="2" fill="#EDF6F0" stroke="#3FA55E"/><text x="614" y="88">marts / serving</text>
    <rect x="768" y="78" width="12" height="12" rx="2" fill="#FBF2E1" stroke="#B57A18"/><text x="786" y="88">quarantine / audit</text>
  </g>

  <!-- ============ BAND A: sources ============ -->
  <rect x="32" y="104" width="1016" height="96" rx="8" fill="#EEF3F6" stroke="#9DAEB9"/>
  <text x="44" y="124" font-size="12.5" font-weight="700" fill="#3B4A55">PUBLIC REGULATOR &amp; INDUSTRY FILES &#8212; keyless &#183; downloadable &#183; versioned by vintage</text>
  <g font-size="10.5" fill="#55666F">
    <rect x="44"  y="132" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="163" y="149" text-anchor="middle">ND DMR &#8212; well-level production</text>
    <rect x="295" y="132" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="414" y="149" text-anchor="middle">TX RRC &#8212; GIS wells &#183; wellbore export</text>
    <rect x="546" y="132" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="665" y="149" text-anchor="middle">NM OCD &#8212; well-level production</text>
    <rect x="797" y="132" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="916" y="149" text-anchor="middle">FracFocus &#8212; completion design</text>
    <rect x="44"  y="164" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="163" y="181" text-anchor="middle">permits &#8212; ND / W-1 / C-101</text>
    <rect x="295" y="164" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="414" y="181" text-anchor="middle">completions &#8212; W-2 / G-1</text>
    <rect x="546" y="164" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="665" y="181" text-anchor="middle">GIS &#8212; well lines, PLSS, spacing, surveys</text>
    <rect x="797" y="164" width="239" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="916" y="181" text-anchor="middle">MT BOGC &#8212; well &#183; lease production</text>
  </g>

  <line x1="540" y1="200" x2="540" y2="218" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,217 544,217 540,224" fill="#7C8B96"/>
  <text x="558" y="216" font-size="11" fill="#55666F">fetch &#8594; hash &#8594; manifest. The file is never edited, only recorded.</text>

  <!-- ============ BAND B: raw ============ -->
  <rect x="32" y="224" width="1016" height="64" rx="8" fill="#EEF3F6" stroke="#9DAEB9"/>
  <text x="44" y="244" font-size="12.5" font-weight="700" fill="#3B4A55">RAW ZONE &#8212; immutable, as downloaded</text>
  <g font-size="10.5" fill="#55666F">
    <rect x="44"  y="252" width="492" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="290" y="269" text-anchor="middle">original bytes on disk &#183; Parquet mirror for columnar reads</text>
    <rect x="548" y="252" width="488" height="26" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/>
    <text x="792" y="269" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10">ingest_manifest: url, fetched_at, sha256, vintage, parser_version</text>
  </g>

  <line x1="540" y1="288" x2="540" y2="306" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,305 544,305 540,312" fill="#7C8B96"/>
  <text x="558" y="304" font-size="11" fill="#55666F">parsers &#8212; one per file type, no opinions, rejects go to quarantine with a reason code</text>

  <!-- ============ BAND C: staging ============ -->
  <rect x="32" y="312" width="1016" height="92" rx="8" fill="#F1F5F8" stroke="#8FA3B0"/>
  <text x="44" y="332" font-size="12.5" font-weight="700" fill="#3B4A55">STAGING &#8212; source-faithful &#183; one schema per regulator file type &#183; never served</text>
  <g font-size="10" fill="#55666F">
    <rect x="44"  y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="121" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">nd_mpr_oil</text>
    <rect x="210" y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="287" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">tx_gis_wells_*</text>
    <rect x="376" y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="453" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">stg_nm_ocd_*</text>
    <rect x="542" y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="619" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">mt_bogc_* &#183; mt_gis_*</text>
    <rect x="708" y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="785" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">fracfocus_disclosures</text>
    <rect x="874" y="340" width="154" height="26" rx="6" fill="#FAFCFD" stroke="#B8C6D0"/><text x="951" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">nd_gis_* &#183; blm_plss_*</text>
  </g>
  <rect x="44" y="372" width="360" height="24" rx="6" fill="#FBF2E1" stroke="#B57A18"/>
  <text x="224" y="388" font-size="10.5" text-anchor="middle" fill="#8A5D10" font-weight="600">QUARANTINE &#8212; rejected rows, reason-coded</text>
  <text x="418" y="388" font-size="10.5" fill="#55666F">served at <tspan font-family="ui-monospace, Consolas, monospace">/v1/quarantine</tspan> &#8212; sidetracks and multi-completion wellbores land here rather than mis-joining</text>

  <line x1="540" y1="404" x2="540" y2="422" stroke="#2A9BB5" stroke-width="1.6"/>
  <polygon points="536,421 544,421 540,428" fill="#2A9BB5"/>
  <text x="558" y="420" font-size="11" fill="#1F7E96" font-weight="600">promotion step &#8212; applies conformance rules, emits a conformance reference into every derivation</text>

  <!-- ============ BAND D: canonical ============ -->
  <rect x="32" y="428" width="1016" height="140" rx="10" fill="#E4F5F9" stroke="#2A9BB5" stroke-width="1.6"/>
  <text x="44" y="448" font-size="14" font-weight="700" fill="#17607A">CANONICAL &#8212; conformed &#183; one schema for the domain</text>
  <text x="44" y="464" font-size="11" fill="#1F7E96">The unified model is the product. API-10 is the spine; API-14 normalizes to it for joins. A mapping that exists only in code fails review (R8).</text>
  <g font-size="10" fill="#17607A" font-family="ui-monospace, Consolas, monospace">
    <rect x="44"  y="472" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="134" y="489" text-anchor="middle">well (API-10)</text>
    <rect x="235" y="472" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="325" y="489" text-anchor="middle">wellbore (API-12/14)</text>
    <rect x="426" y="472" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="516" y="489" text-anchor="middle">operator</text>
    <rect x="617" y="472" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="707" y="489" text-anchor="middle">lease (TX)</text>

    <rect x="44"  y="504" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="134" y="521" text-anchor="middle">production_observation</text>
    <rect x="235" y="504" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="325" y="521" text-anchor="middle">completion_event</text>
    <rect x="426" y="504" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="516" y="521" text-anchor="middle">permit</text>
    <rect x="617" y="504" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="707" y="521" text-anchor="middle">spacing_unit</text>

    <rect x="44"  y="536" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="134" y="553" text-anchor="middle">land_unit (PLSS)</text>
    <rect x="235" y="536" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="325" y="553" text-anchor="middle">formation_top</text>
    <rect x="426" y="536" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="516" y="553" text-anchor="middle" font-size="9">surface &#183; bottomhole &#183; lateral</text>
    <rect x="617" y="536" width="181" height="26" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="707" y="553" text-anchor="middle">well_status</text>
  </g>

  <rect x="812" y="472" width="224" height="90" rx="8" fill="#FFFFFF" stroke="#2A9BB5" stroke-dasharray="5,3"/>
  <text x="924" y="490" font-size="11" font-weight="700" fill="#17607A" text-anchor="middle">CONFORMANCE REGISTRY &#183; R8</text>
  <g font-size="10" fill="#1F7E96" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <text x="924" y="508">conformance_rules</text>
    <text x="924" y="524">formation_aliases</text>
    <text x="924" y="540">crs_registry</text>
  </g>
  <text x="924" y="556" font-size="9.5" fill="#55666F" text-anchor="middle" font-family="system-ui, sans-serif">served at /conformance</text>

  <line x1="540" y1="568" x2="540" y2="586" stroke="#3FA55E" stroke-width="1.4"/>
  <polygon points="536,585 544,585 540,592" fill="#3FA55E"/>
  <text x="558" y="584" font-size="11" fill="#55666F">marts derive from canonical only &#8212; a mart that reads staging is a build error</text>

  <!-- ============ BAND E: marts ============ -->
  <rect x="32" y="592" width="1016" height="88" rx="8" fill="#EDF6F0" stroke="#3FA55E"/>
  <text x="44" y="612" font-size="12.5" font-weight="700" fill="#2C6E43">MARTS &#8212; serving surfaces, rebuildable from canonical at any time</text>
  <g font-size="10" fill="#2C6E43" font-family="ui-monospace, Consolas, monospace">
    <rect x="44"  y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="122" y="641" text-anchor="middle">well_features</text>
    <rect x="211" y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="289" y="641" text-anchor="middle">type_curve_sets</text>
    <rect x="378" y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="456" y="641" text-anchor="middle">analog_index</text>
    <rect x="545" y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="623" y="641" text-anchor="middle">rollups</text>
    <rect x="712" y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="790" y="641" text-anchor="middle">inventory_slots</text>
    <rect x="879" y="622" width="157" height="30" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="957" y="641" text-anchor="middle">PostGIS &#8594; tiles</text>
  </g>
  <text x="44" y="670" font-size="10" fill="#3B4A55">Parquet + DuckDB for the analytical path &#183; PostGIS for geometry and spacing math (projected CRS per basin, stored EPSG:4326) &#183; martin for vector tiles</text>

  <line x1="540" y1="680" x2="540" y2="698" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,697 544,697 540,704" fill="#7C8B96"/>

  <!-- ============ BAND F: serving ============ -->
  <text x="32" y="700" font-size="12.5" font-weight="700" fill="#3B4A55">SERVING &#8212; one API, three consumers. If the agent cannot do it, the API is incomplete.</text>

  <rect x="44" y="712" width="321" height="106" rx="9" fill="#F1F5F8" stroke="#2A9BB5" stroke-width="1.4"/>
  <text x="60" y="732" font-size="12.5" font-weight="700" fill="#17607A">API &#8212; FastAPI + OpenAPI</text>
  <g font-size="10" fill="#3B4A55" font-family="ui-monospace, Consolas, monospace">
    <rect x="60" y="740" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="204" y="755" text-anchor="middle">/wells &#183; /forecasts &#183; /valuations</text>
    <rect x="60" y="766" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="204" y="781" text-anchor="middle">/scenarios &#183; /sensitivities &#183; /inventory</text>
    <rect x="60" y="792" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="204" y="807" text-anchor="middle">/explain &#183; /conformance &#183; /quarantine</text>
  </g>

  <rect x="379" y="712" width="321" height="106" rx="9" fill="#F1F5F8" stroke="#2A9BB5" stroke-width="1.4"/>
  <text x="395" y="732" font-size="12.5" font-weight="700" fill="#17607A">MAP UI &#8212; MapLibre + deck.gl</text>
  <g font-size="10" fill="#3B4A55">
    <rect x="395" y="740" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="539" y="755" text-anchor="middle">20k+ laterals, model-driven styling</text>
    <rect x="395" y="766" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="539" y="781" text-anchor="middle">well card &#183; type-curve builder &#183; league table</text>
    <rect x="395" y="792" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="539" y="807" text-anchor="middle">lineage drawer on every number</text>
  </g>

  <rect x="714" y="712" width="321" height="106" rx="9" fill="#F1F5F8" stroke="#2A9BB5" stroke-width="1.4"/>
  <text x="730" y="732" font-size="12.5" font-weight="700" fill="#17607A">AGENT GATEWAY &#8212; curated MCP tools</text>
  <g font-size="10" fill="#3B4A55">
    <rect x="730" y="740" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="874" y="755" text-anchor="middle">tools map 1:1 onto public endpoints</text>
    <rect x="730" y="766" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="874" y="781" text-anchor="middle">10-question suite is the completeness test</text>
    <rect x="730" y="792" width="289" height="22" rx="5" fill="#FFFFFF" stroke="#B8C6D0"/><text x="874" y="807" text-anchor="middle">every answer carries its derivation</text>
  </g>

  <!-- ============ BAND G: cross-cutting ============ -->
  <rect x="32" y="836" width="1016" height="88" rx="8" fill="#FBF2E1" stroke="#B57A18"/>
  <text x="44" y="856" font-size="12.5" font-weight="700" fill="#8A5D10">CROSS-CUTTING &#8212; append-only memory. Restatements are new events, never edits.</text>
  <g font-size="10" fill="#6B4A0C">
    <rect x="44"  y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="121" y="883" text-anchor="middle">audit stream</text>
    <rect x="209" y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="286" y="883" text-anchor="middle">derivations</text>
    <rect x="374" y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="451" y="883" text-anchor="middle">recipes</text>
    <rect x="539" y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="616" y="883" text-anchor="middle">forecast ledger</text>
    <rect x="704" y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="781" y="883" text-anchor="middle">quality scorecard</text>
    <rect x="869" y="864" width="155" height="30" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="946" y="883" text-anchor="middle">benchmark harness</text>
  </g>
  <text x="44" y="912" font-size="9.5" fill="#6B4A0C">Every band writes here. A recipe regenerates its artifact byte-for-byte; a derivation names the rows, the model, the deck, and the conformance rules that produced the number.</text>

  <text x="32" y="948" font-size="10" fill="#7C8B96">One VM &#183; no distributed infrastructure &#183; public data only. Reproducibility is an output, not a promise: a stranger with the OpenAPI doc and a key rebuilds every number on the screen.</text>
</svg>
