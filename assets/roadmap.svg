<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 818" width="1080" height="818" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="glasswell build phases P0 through P8 with exit criteria, cut order and never-cut items">
  <rect x="1" y="1" width="1078" height="816" rx="14" fill="#FFFFFF" stroke="#D8E1E8" stroke-width="1"/>

  <text x="32" y="42" font-size="22" font-weight="700" fill="#0B1014">Build Phases &#8212; P0 through P8</text>
  <text x="32" y="64" font-size="12.5" fill="#55666F">Every phase exits on a stated criterion, not on a feeling. The cut order under compression is pre-committed, and some things are never cut.</text>

  <g font-size="11" fill="#55666F">
    <rect x="32"  y="76" width="12" height="12" rx="2" fill="#EEF3F6" stroke="#9DAEB9"/><text x="50"  y="86">foundation</text>
    <rect x="164" y="76" width="12" height="12" rx="2" fill="#EDF6F0" stroke="#3FA55E"/><text x="182" y="86">product surface</text>
    <rect x="320" y="76" width="12" height="12" rx="2" fill="#E4F5F9" stroke="#2A9BB5"/><text x="338" y="86">modeling</text>
    <rect x="444" y="76" width="12" height="12" rx="2" fill="#FBF2E1" stroke="#B57A18"/><text x="462" y="86">expansion</text>
  </g>

  <!-- ===== Row 1: P0 P1 P2 ===== -->
  <g>
    <rect x="44" y="100" width="322" height="160" rx="9" fill="#EEF3F6" stroke="#9DAEB9"/>
    <rect x="56" y="112" width="40" height="20" rx="5" fill="#7C8B96"/><text x="76" y="126" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P0</text>
    <text x="106" y="127" font-size="13" font-weight="700" fill="#3B4A55">Scaffold and contracts</text>
    <g font-size="9.5" fill="#55666F">
      <text x="58" y="154">repo layout: staging / canonical / marts</text>
      <text x="58" y="171">derivation capture before the first transform</text>
      <text x="58" y="188">conformance registry and glossary seeded</text>
    </g>
    <line x1="58" y1="200" x2="352" y2="200" stroke="#C7D2DA"/>
    <text x="58" y="216" font-size="9.5" font-weight="700" fill="#3B4A55">EXIT</text>
    <text x="58" y="230" font-size="9.5" fill="#55666F">audit stream append-only as enforced; envelope</text>
    <text x="58" y="242" font-size="9.5" fill="#55666F">and error model frozen; one recipe replays</text>
  </g>

  <g>
    <rect x="378" y="100" width="322" height="160" rx="9" fill="#EEF3F6" stroke="#9DAEB9"/>
    <rect x="390" y="112" width="40" height="20" rx="5" fill="#7C8B96"/><text x="410" y="126" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P1</text>
    <text x="440" y="127" font-size="13" font-weight="700" fill="#3B4A55">ND spine</text>
    <g font-size="9.5" fill="#55666F">
      <text x="392" y="154">free NDIC and DMR GIS paths; no subscription</text>
      <text x="392" y="171">parsers write staging; promotion emits rules</text>
      <text x="392" y="188">bitemporal vintages; quarantine measured</text>
    </g>
    <line x1="392" y1="200" x2="686" y2="200" stroke="#C7D2DA"/>
    <text x="392" y="216" font-size="9.5" font-weight="700" fill="#3B4A55">EXIT</text>
    <text x="392" y="230" font-size="9.5" fill="#55666F">every production row explains to a manifest</text>
    <text x="392" y="242" font-size="9.5" fill="#55666F">and cites the rules that shaped it</text>
  </g>

  <g>
    <rect x="712" y="100" width="322" height="160" rx="9" fill="#EDF6F0" stroke="#3FA55E"/>
    <rect x="724" y="112" width="40" height="20" rx="5" fill="#3FA55E"/><text x="744" y="126" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P2</text>
    <text x="774" y="127" font-size="13" font-weight="700" fill="#2C6E43">Serving and map</text>
    <g font-size="9.5" fill="#2C6E43">
      <text x="726" y="154">API v1 over the ND surface</text>
      <text x="726" y="171">geometry tiles + client-side attribute join</text>
      <text x="726" y="188">well card, lineage drawer, glossary tooltip</text>
    </g>
    <line x1="726" y1="200" x2="1020" y2="200" stroke="#A8D6B7"/>
    <text x="726" y="216" font-size="9.5" font-weight="700" fill="#2C6E43">EXIT</text>
    <text x="726" y="230" font-size="9.5" fill="#2C6E43">20k+ laterals at frame rate; every UI figure</text>
    <text x="726" y="242" font-size="9.5" fill="#2C6E43">has a reproducing endpoint</text>
  </g>

  <!-- ===== Row 2: P3 P4 P5 ===== -->
  <g>
    <rect x="44" y="280" width="322" height="160" rx="9" fill="#E4F5F9" stroke="#2A9BB5"/>
    <rect x="56" y="292" width="40" height="20" rx="5" fill="#2A9BB5"/><text x="76" y="306" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P3</text>
    <text x="106" y="307" font-size="13" font-weight="700" fill="#17607A">Forecasting and benchmark</text>
    <g font-size="9.5" fill="#1F7E96">
      <text x="58" y="334">entry: the production back-load, 2015-05 &#8594; 2025-09</text>
      <text x="58" y="351">three-stream quantile models + conformal</text>
      <text x="58" y="368">type curve as the pinned control group</text>
    </g>
    <line x1="58" y1="380" x2="352" y2="380" stroke="#9FD6E4"/>
    <text x="58" y="396" font-size="9.5" font-weight="700" fill="#17607A">EXIT</text>
    <text x="58" y="410" font-size="9.5" fill="#1F7E96">120+ production months to enter; calibration</text>
    <text x="58" y="422" font-size="9.5" fill="#1F7E96">and analog checks green, not just measured</text>
  </g>

  <g>
    <rect x="378" y="280" width="322" height="160" rx="9" fill="#E4F5F9" stroke="#2A9BB5"/>
    <rect x="390" y="292" width="40" height="20" rx="5" fill="#2A9BB5"/><text x="410" y="306" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P4</text>
    <text x="440" y="307" font-size="13" font-weight="700" fill="#17607A">Dollars and scenarios</text>
    <g font-size="9.5" fill="#1F7E96">
      <text x="392" y="334">DCF at a named deck; breakeven and payout</text>
      <text x="392" y="351">tornado sensitivities; analog panel</text>
      <text x="392" y="368">type-curve builder in the UI</text>
    </g>
    <line x1="392" y1="380" x2="686" y2="380" stroke="#9FD6E4"/>
    <text x="392" y="396" font-size="9.5" font-weight="700" fill="#17607A">EXIT</text>
    <text x="392" y="410" font-size="9.5" fill="#1F7E96">scenario returns forecast + NPV in under three</text>
    <text x="392" y="422" font-size="9.5" fill="#1F7E96">seconds; P10/P50/P90 reported together</text>
  </g>

  <g>
    <rect x="712" y="280" width="322" height="160" rx="9" fill="#EDF6F0" stroke="#3FA55E"/>
    <rect x="724" y="292" width="40" height="20" rx="5" fill="#3FA55E"/><text x="744" y="306" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P5</text>
    <text x="774" y="307" font-size="13" font-weight="700" fill="#2C6E43">Intelligence, agents and alerts</text>
    <g font-size="9.5" fill="#2C6E43">
      <text x="726" y="334">operator league table on the residual metric</text>
      <text x="726" y="351">AOIs and weekly digests; well sets and rollups</text>
      <text x="726" y="368">agent gateway; the forecast ledger starts writing</text>
    </g>
    <line x1="726" y1="380" x2="1020" y2="380" stroke="#A8D6B7"/>
    <text x="726" y="396" font-size="9.5" font-weight="700" fill="#2C6E43">EXIT</text>
    <text x="726" y="410" font-size="9.5" fill="#2C6E43">the ten-question suite passes through public</text>
    <text x="726" y="422" font-size="9.5" fill="#2C6E43">tools; the tool-equivalence report is clean</text>
  </g>

  <!-- ===== Row 3: P6 P7 P8 ===== -->
  <g>
    <rect x="44" y="460" width="322" height="160" rx="9" fill="#EDF6F0" stroke="#3FA55E"/>
    <rect x="56" y="472" width="40" height="20" rx="5" fill="#3FA55E"/><text x="76" y="486" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P6</text>
    <text x="106" y="487" font-size="13" font-weight="700" fill="#2C6E43">Hardening and glass-box proof</text>
    <g font-size="9.5" fill="#2C6E43">
      <text x="58" y="514">seven CI checks wired and blocking</text>
      <text x="58" y="531">tunnel and Access; guest keys; rate limits</text>
      <text x="58" y="548">backup and a live restore drill</text>
    </g>
    <line x1="58" y1="560" x2="352" y2="560" stroke="#A8D6B7"/>
    <text x="58" y="576" font-size="9.5" font-weight="700" fill="#2C6E43">EXIT</text>
    <text x="58" y="590" font-size="9.5" fill="#2C6E43">a stranger with a guest key reproduces every</text>
    <text x="58" y="602" font-size="9.5" fill="#2C6E43">number in the UI; the restore drill is run</text>
  </g>

  <g>
    <rect x="378" y="460" width="322" height="160" rx="9" fill="#FBF2E1" stroke="#B57A18"/>
    <rect x="390" y="472" width="40" height="20" rx="5" fill="#B57A18"/><text x="410" y="486" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P7</text>
    <text x="440" y="487" font-size="13" font-weight="700" fill="#8A5D10">Permian &#8212; NM first, then TX</text>
    <g font-size="9.5" fill="#6B4A0C">
      <text x="392" y="514">NM OCD well-level spine first</text>
      <text x="392" y="531">TX RRC lease production, wellbore, county GIS</text>
      <text x="392" y="548">allocation v0 with two validators</text>
    </g>
    <line x1="392" y1="560" x2="686" y2="560" stroke="#DDBB77"/>
    <text x="392" y="576" font-size="9.5" font-weight="700" fill="#8A5D10">EXIT</text>
    <text x="392" y="590" font-size="9.5" fill="#6B4A0C">allocation error bounds from both validators;</text>
    <text x="392" y="602" font-size="9.5" fill="#6B4A0C">a TX spacing value explains through its datum</text>
  </g>

  <g>
    <rect x="712" y="460" width="322" height="160" rx="9" fill="#FBF2E1" stroke="#B57A18"/>
    <rect x="724" y="472" width="40" height="20" rx="5" fill="#B57A18"/><text x="744" y="486" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P8</text>
    <text x="774" y="487" font-size="13" font-weight="700" fill="#8A5D10">Living systems</text>
    <g font-size="9.5" fill="#6B4A0C">
      <text x="726" y="514">one graded forecast-ledger cycle</text>
      <text x="726" y="531">inventory v0: admissible slots at an assumed spacing</text>
      <text x="726" y="548">capability matrix; publish decision</text>
    </g>
    <line x1="726" y1="560" x2="1020" y2="560" stroke="#DDBB77"/>
    <text x="726" y="576" font-size="9.5" font-weight="700" fill="#8A5D10">EXIT</text>
    <text x="726" y="590" font-size="9.5" fill="#6B4A0C">township inventory demo recorded; honest gaps</text>
    <text x="726" y="602" font-size="9.5" fill="#6B4A0C">tagged data-unreachable or effort-unreachable</text>
  </g>

  <!-- ===== cut order ===== -->
  <rect x="44" y="638" width="992" height="76" rx="8" fill="#F7FAFC" stroke="#D8E1E8"/>
  <text x="58" y="658" font-size="11.5" font-weight="700" fill="#3B4A55">CUT ORDER UNDER COMPRESSION</text>
  <g font-size="9.5" fill="#55666F">
    <rect x="58"  y="666" width="72" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="94"  y="680" text-anchor="middle">transfer</text>
    <rect x="136" y="666" width="76" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="174" y="680" text-anchor="middle">inventory</text>
    <rect x="218" y="666" width="64" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="250" y="680" text-anchor="middle">alerts</text>
    <rect x="288" y="666" width="86" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="331" y="680" text-anchor="middle">league table</text>
    <rect x="380" y="666" width="72" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="416" y="680" text-anchor="middle">activity</text>
    <rect x="458" y="666" width="70" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="493" y="680" text-anchor="middle">UI polish</text>
    <rect x="534" y="666" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#B8C6D0"/><text x="574" y="680" text-anchor="middle">field notes</text>
  </g>
  <text x="58" y="704" font-size="9.5" fill="#7C8B96">First cut on the left. The memos still get written when the last one goes &#8212; only the reader is cut. Deciding this in advance stops a slip from quietly eating the load-bearing work.</text>

  <!-- ===== never cut ===== -->
  <rect x="44" y="726" width="992" height="76" rx="8" fill="#FDF6F5" stroke="#E0A9A5"/>
  <text x="58" y="746" font-size="11.5" font-weight="700" fill="#A03B33">NEVER CUT</text>
  <g font-size="9.5" fill="#8C3830">
    <rect x="58"  y="754" width="106" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="111" y="768" text-anchor="middle">ingest + canonical</text>
    <rect x="172" y="754" width="112" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="228" y="768" text-anchor="middle">benchmark control</text>
    <rect x="292" y="754" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="332" y="768" text-anchor="middle">economics</text>
    <rect x="380" y="754" width="106" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="433" y="768" text-anchor="middle">quality scorecard</text>
    <rect x="494" y="754" width="118" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="553" y="768" text-anchor="middle">allocation validators</text>
    <rect x="620" y="754" width="146" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="693" y="768" text-anchor="middle" font-size="9">derivations + conformance</text>
    <rect x="774" y="754" width="68" height="20" rx="10" fill="#FFFFFF" stroke="#E0A9A5"/><text x="808" y="768" text-anchor="middle">glossary</text>
  </g>
  <text x="58" y="792" font-size="9.5" fill="#B05A52">The registry is cheap and load-bearing: without it, no cross-source number can cite the rules that shaped it. Without the benchmark control, every accuracy claim is marketing.</text>
</svg>
