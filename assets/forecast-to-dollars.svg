<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 715" width="1080" height="715" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="glasswell modeling pipeline: features feed a quantile model and a type-curve control, both scored on one temporal holdout, producing three-stream forecasts that drive discounted cash flow economics">
  <rect x="1" y="1" width="1078" height="713" rx="14" fill="#FFFFFF" stroke="#D8E1E8" stroke-width="1"/>

  <text x="32" y="42" font-size="22" font-weight="700" fill="#0B1014">Forecast to Dollars &#8212; and the control group that keeps it honest</text>
  <text x="32" y="64" font-size="12.5" fill="#55666F">One temporal holdout. Both methods scored on identical rows. The type curve is not a straw man &#8212; it is the control, and it is allowed to win.</text>

  <!-- B1 features -->
  <rect x="32" y="88" width="1016" height="68" rx="8" fill="#EEF3F6" stroke="#9DAEB9"/>
  <text x="44" y="108" font-size="12.5" font-weight="700" fill="#3B4A55">WELL FEATURES &#8212; built from canonical only, versioned, leak-checked</text>
  <g font-size="10.5" fill="#55666F">
    <rect x="44"  y="116" width="188" height="30" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="138" y="135" text-anchor="middle">location &amp; landing zone</text>
    <rect x="244" y="116" width="188" height="30" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="338" y="135" text-anchor="middle">completion design</text>
    <rect x="444" y="116" width="188" height="30" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="538" y="135" text-anchor="middle">spacing &amp; depletion context</text>
    <rect x="644" y="116" width="188" height="30" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="738" y="135" text-anchor="middle">operator &amp; vintage</text>
    <rect x="844" y="116" width="188" height="30" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="938" y="135" text-anchor="middle">formation tops</text>
  </g>

  <line x1="540" y1="156" x2="540" y2="170" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,169 544,169 540,176" fill="#7C8B96"/>

  <!-- B2 two lanes -->
  <rect x="32" y="176" width="504" height="112" rx="9" fill="#E4F5F9" stroke="#2A9BB5" stroke-width="1.5"/>
  <text x="44" y="196" font-size="12.5" font-weight="700" fill="#17607A">MODEL LANE &#8212; gradient-boosted quantile regression</text>
  <g font-size="10" fill="#17607A">
    <rect x="44"  y="204" width="153" height="26" rx="5" fill="#F4FCFD" stroke="#7FC5D8"/><text x="120" y="221" text-anchor="middle">quantile GBM</text>
    <rect x="207" y="204" width="153" height="26" rx="5" fill="#F4FCFD" stroke="#7FC5D8"/><text x="283" y="221" text-anchor="middle">P10 / P50 / P90 heads</text>
    <rect x="370" y="204" width="153" height="26" rx="5" fill="#F4FCFD" stroke="#7FC5D8"/><text x="446" y="221" text-anchor="middle">conformal calibration</text>
    <rect x="44"  y="236" width="235" height="26" rx="5" fill="#F4FCFD" stroke="#7FC5D8"/><text x="161" y="253" text-anchor="middle">three-stream: oil, gas, water</text>
    <rect x="289" y="236" width="235" height="26" rx="5" fill="#F4FCFD" stroke="#7FC5D8"/><text x="406" y="253" text-anchor="middle">training_support on every forecast</text>
  </g>
  <text x="44" y="278" font-size="10" fill="#1F7E96">Coverage is measured and reported. A stated P10&#8211;P90 that does not hold is a defect, not a caveat.</text>

  <rect x="544" y="176" width="504" height="112" rx="9" fill="#EDF6F0" stroke="#3FA55E" stroke-width="1.5"/>
  <text x="556" y="196" font-size="12.5" font-weight="700" fill="#2C6E43">CONTROL LANE &#8212; type curve</text>
  <g font-size="10" fill="#2C6E43">
    <rect x="556" y="204" width="153" height="26" rx="5" fill="#F8FCF9" stroke="#94C9A6"/><text x="632" y="221" text-anchor="middle">peer set: area &#215; vintage</text>
    <rect x="719" y="204" width="153" height="26" rx="5" fill="#F8FCF9" stroke="#94C9A6"/><text x="795" y="221" text-anchor="middle">normalized per 1,000 ft</text>
    <rect x="882" y="204" width="153" height="26" rx="5" fill="#F8FCF9" stroke="#94C9A6"/><text x="958" y="221" text-anchor="middle">median + P10/P90 band</text>
    <rect x="556" y="236" width="235" height="26" rx="5" fill="#F8FCF9" stroke="#94C9A6"/><text x="673" y="253" text-anchor="middle">the workflow the category runs today</text>
    <rect x="801" y="236" width="234" height="26" rx="5" fill="#F8FCF9" stroke="#94C9A6"/><text x="918" y="253" text-anchor="middle">built from the same rows, same split</text>
  </g>
  <text x="556" y="278" font-size="10" fill="#2C6E43">If the model cannot beat this on an identical holdout, the ML advantage is zero &#8212; publicly.</text>

  <line x1="284" y1="288" x2="284" y2="302" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="280,301 288,301 284,308" fill="#7C8B96"/>
  <line x1="796" y1="288" x2="796" y2="302" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="792,301 800,301 796,308" fill="#7C8B96"/>

  <!-- B3 benchmark -->
  <rect x="32" y="308" width="1016" height="74" rx="8" fill="#FBF2E1" stroke="#B57A18" stroke-width="1.4"/>
  <text x="44" y="328" font-size="12.5" font-weight="700" fill="#8A5D10">BENCHMARK HARNESS &#8212; one temporal holdout, both methods, sliced and published</text>
  <g font-size="10" fill="#6B4A0C">
    <rect x="44"  y="336" width="188" height="28" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="138" y="354" text-anchor="middle">error on cum12</text>
    <rect x="244" y="336" width="188" height="28" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="338" y="354" text-anchor="middle">P10&#8211;P90 coverage</text>
    <rect x="444" y="336" width="188" height="28" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="538" y="354" text-anchor="middle">sliced: basin &#183; vintage &#183; operator</text>
    <rect x="644" y="336" width="188" height="28" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="738" y="354" text-anchor="middle">analog quality check</text>
    <rect x="844" y="336" width="188" height="28" rx="6" fill="#FEFBF4" stroke="#DDBB77"/><text x="938" y="354" text-anchor="middle">artifact per basin</text>
  </g>
  <text x="44" y="376" font-size="9.5" fill="#6B4A0C">Answers the only question that matters about the ML claim: how large is the advantage over the incumbent method, measured honestly, on rows neither method has seen.</text>

  <line x1="540" y1="382" x2="540" y2="396" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,395 544,395 540,402" fill="#7C8B96"/>

  <!-- B4 forecast -->
  <rect x="32" y="402" width="1016" height="74" rx="8" fill="#EDF6F0" stroke="#3FA55E"/>
  <text x="44" y="422" font-size="12.5" font-weight="700" fill="#2C6E43">THREE-STREAM FORECAST &#8212; oil is the headline, all three ship together</text>
  <g font-size="10.5" fill="#2C6E43">
    <rect x="44"  y="430" width="239" height="28" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="163" y="448" text-anchor="middle">oil &#8212; primary target</text>
    <rect x="295" y="430" width="239" height="28" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="414" y="448" text-anchor="middle">gas &#8212; secondary target</text>
    <rect x="546" y="430" width="239" height="28" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="665" y="448" text-anchor="middle">water &#8212; secondary target</text>
    <rect x="797" y="430" width="239" height="28" rx="6" fill="#F8FCF9" stroke="#94C9A6"/><text x="916" y="448" text-anchor="middle">GOR &amp; water cut &#8212; derived</text>
  </g>
  <text x="44" y="470" font-size="9.5" fill="#2C6E43">Identical split, censoring and controls across all three streams. GOR and water cut are reported surfaces, never model targets. Liquids policy is stated wherever the number appears.</text>

  <line x1="540" y1="476" x2="540" y2="490" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,489 544,489 540,496" fill="#7C8B96"/>

  <!-- B5 economics -->
  <rect x="32" y="496" width="1016" height="74" rx="8" fill="#E4F5F9" stroke="#2A9BB5"/>
  <text x="44" y="516" font-size="12.5" font-weight="700" fill="#17607A">ECONOMICS &#8212; deterministic DCF against a named deck</text>
  <g font-size="10" fill="#17607A">
    <rect x="44"  y="524" width="188" height="28" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="138" y="542" text-anchor="middle">NPV10 &#183; IRR &#183; payout</text>
    <rect x="244" y="524" width="188" height="28" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="338" y="542" text-anchor="middle">breakeven distribution</text>
    <rect x="444" y="524" width="188" height="28" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="538" y="542" text-anchor="middle">water handling opex</text>
    <rect x="644" y="524" width="188" height="28" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="738" y="542" text-anchor="middle">per-state severance</text>
    <rect x="844" y="524" width="188" height="28" rx="6" fill="#F4FCFD" stroke="#7FC5D8"/><text x="938" y="542" text-anchor="middle">NRI / working interest</text>
  </g>
  <text x="44" y="564" font-size="9.5" fill="#1F7E96">A pure function of (forecast, deck, assumptions) &#8212; which is what makes sensitivities, scenarios and batch inventory runs cost almost nothing.</text>

  <line x1="540" y1="570" x2="540" y2="584" stroke="#7C8B96" stroke-width="1.4"/>
  <polygon points="536,583 544,583 540,590" fill="#7C8B96"/>

  <!-- B6 consumers -->
  <rect x="32" y="590" width="1016" height="74" rx="8" fill="#EEF3F6" stroke="#9DAEB9"/>
  <text x="44" y="610" font-size="12.5" font-weight="700" fill="#3B4A55">CONSUMERS &#8212; the same forecast and the same deck, reused</text>
  <g font-size="10" fill="#55666F">
    <rect x="44"  y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="122" y="636" text-anchor="middle">scenario card</text>
    <rect x="211" y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="289" y="636" text-anchor="middle">tornado sensitivities</text>
    <rect x="378" y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="456" y="636" text-anchor="middle">analog panel</text>
    <rect x="545" y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="623" y="636" text-anchor="middle">inventory rollup</text>
    <rect x="712" y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="790" y="636" text-anchor="middle">well-set rollup</text>
    <rect x="879" y="618" width="157" height="28" rx="6" fill="#F9FBFC" stroke="#B8C6D0"/><text x="957" y="636" text-anchor="middle">forecast ledger</text>
  </g>
  <text x="44" y="658" font-size="9.5" fill="#55666F">The ledger writes every forecast at issue time and grades it as actuals arrive &#8212; a track record that compounds instead of a number that ages.</text>

  <text x="32" y="694" font-size="10" fill="#7C8B96">Guardrails (protocol 4A/4D): temporal holdout only &#183; no post-spud leakage &#183; producing-months censoring stated &#183; no inventory slot without geometric admissibility and a support score.</text>
</svg>
