# Seed set for canonical.glossary_terms (DIR-8, E18, R9). Transcribed from blueprint-v0.6 §9,
# plus the ten lineage terms SB-07 §12 hands back as undefined. Two entries are deliberately
# not verbatim: Audit stream drops the hash-chain claim (M8), and Training support carries the
# retirement of the "support score" name.

- term: API-10 / API-12 / API-14
  aliases: ["API-10", "API-12", "API-14", "API number"]
  short_definition: >-
    The American Petroleum Institute well number; API-10 is glasswell's identity spine.
  expanded_definition: >-
    Digits 1-2 are the state (ND 33, TX 42, NM 30 - API codes, not FIPS), 3-5 the county at
    time of permitting, 6-10 the unique well. Digits 11-12 identify the sidetrack; 13-14 are
    convention rather than standard, which is why glasswell slices them off rather than
    trusting them. The free ND monthly report carries API-14, so API-10 is its first ten digits.
  domain_tags: [identity, data-model]
  related_terms: ["Spine", "Wellbore"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.4", "DIR-9"]

- term: Allocation / allocation v0
  aliases: ["Allocation", "Allocated"]
  short_definition: >-
    Estimating well-level volumes from a lease-level report by splitting the lease total
    across its wells.
  expanded_definition: >-
    Necessary only in Texas, where production is reported by lease rather than by well. An
    allocated figure is always labelled allocated and never observed, and it carries the id
    of the allocation model that produced it.
  domain_tags: [production, data-model]
  related_terms: ["Granularity", "Naked number"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Analog
  highlightable: false
  short_definition: >-
    A well near another in feature space - rock, design, location - rather than in physical
    space.
  expanded_definition: >-
    A neighbour is near in metres; an analog is near in the variables that drive performance.
    Confusing the two is how a comparison set ends up full of wells that share a section and
    nothing else.
  domain_tags: [modeling]
  related_terms: ["Type curve", "Training support"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Audit stream
  short_definition: >-
    The system's single append-only event log: restatements, promotions, model publications
    and key uses are events in it.
  expanded_definition: >-
    Append-only is enforced twice and structurally: the runtime roles hold insert and select
    but no update or delete, and a before-update-or-delete trigger raises on any attempt.
    There is no tamper-evident chain over the events, and glasswell does not claim one.
  domain_tags: [lineage, governance]
  related_terms: ["Quarantine", "Restatement"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §5.1", "SB-04 §10 E-22"]

- term: Band
  highlightable: false
  short_definition: >-
    The P10-P90 interval around a forecast or type curve.
  expanded_definition: >-
    A curve without a band is not shipped, because a single line implies a precision the
    underlying data does not support.
  domain_tags: [modeling]
  related_terms: ["Type curve"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Basemap
  short_definition: >-
    The background reference cartography a map draws over. Never the source of a served
    number.
  expanded_definition: >-
    glasswell's layers are regulator geometry; whatever sits beneath them is a basemap. The
    switcher offers several because a dark canvas, a light one and imagery answer different
    questions, and none of them changes what a figure says.
  domain_tags: [geospatial, serving]
  related_terms: ["Viewport", "Source"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Basin
  aliases: ["Petroleum basin", "Basins"]
  short_definition: >-
    A named geologic region registered for a source namespace.
  expanded_definition: >-
    A basin is served only where glasswell has explicitly associated the contributing source
    namespace with that region. An unscoped legacy alias does not silently inherit a basin,
    and a formation name alone is not enough to infer one.
  domain_tags: [geology, data-model]
  related_terms: ["Formation", "Source"]
  source_refs: ["SB-04 §4.7", "lineage.sources"]

- term: Bitemporal
  aliases: ["Bitemporality"]
  short_definition: >-
    Carrying two time axes: when something happened (the production month) and when it was
    reported (the report vintage).
  expanded_definition: >-
    The mechanism that makes restatement survivable. glasswell never updates a production row;
    a regulator revision arrives as a new row at a later report vintage, and every read states
    which vintage it resolved to.
  domain_tags: [lineage, time, data-model]
  related_terms: ["Report vintage", "Valid time", "Knowledge time", "Restatement"]
  source_refs: ["blueprint-v0.6 §9", "DIR-2"]

- term: Cadence
  aliases: ["Pull cadence", "Upstream cadence"]
  short_definition: >-
    How often a source publishes, and how often glasswell polls it. Two rates, recorded
    per source.
  expanded_definition: >-
    Freshness is judged against the pull cadence, not against a wall clock: a monthly source
    polled weekly is current the day after an unchanged check, and a nightly source is not.
    The pair is registered per source rather than assumed.
  domain_tags: [operations, time]
  related_terms: ["Timer", "Retrieval vintage", "Manifest", "Scheduled job"]
  source_refs:
    ["blueprint-v0.6 §3.7.4", "lineage.source_poll_policies", "lineage.job_schedules"]

- term: Canonical
  short_definition: >-
    The conformed layer: one schema for the domain, every mapping decision recorded,
    observations at native granularity.
  expanded_definition: >-
    Canonical never estimates. A value here is something a regulator reported, mapped through
    a recorded conformance rule, and stamped with the manifest and derivation that produced it.
  domain_tags: [data-model, lineage]
  related_terms: ["Staging", "Marts", "Conformance rule"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.4"]

- term: Completion event
  aliases: ["Completion date", "Frac job end"]
  short_definition: >-
    A source-observed operation completed on a well, identified by the kind of event the
    source actually reports.
  expanded_definition: >-
    The current North Dakota anchor is FracFocus JobEndDate: the end of a hydraulic-fracturing
    job. It is not a spud date, first-production date, or inferred completion date. A pool
    assignment is a separate source entity and is not joined to an event unless a canonical
    source key proves the relationship.
  domain_tags: [completion, time, lineage]
  related_terms: ["Pool", "Spud date", "First production"]
  source_refs: ["canonical.well_completion_anchors", "blueprint-v0.6 §3.6 endpoint 7"]

- term: Condensate
  short_definition: >-
    Light liquid hydrocarbon produced with gas, classified differently by different states.
  expanded_definition: >-
    Because the classification is not portable, glasswell states a liquids policy rather than
    silently choosing one, and preserves the regulator's own classification in staging.
  domain_tags: [production]
  related_terms: ["Liquids policy", "Stream"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Confidential well
  aliases: ["Confidential"]
  short_definition: >-
    A well whose production a regulator withholds for a statutory period.
  expanded_definition: >-
    Withheld is a distinct state from missing and is never collapsed into it. In North Dakota
    the confidential state arrives as a well status of its own, which is why the canonical
    well record carries a confidential flag alongside the mapped status.
  domain_tags: [production, quality]
  related_terms: ["Withheld", "Granularity"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.3"]

- term: Conformance rule
  aliases: ["Conformance rules"]
  short_definition: >-
    A recorded cross-source mapping decision with its rationale, evidence and effective dates.
  expanded_definition: >-
    Rules are served as data, not buried in code: a mapping that exists only in a parser fails
    review. Each rule declares the stage it runs at, the kind of transform it is, and what
    happens to a row it cannot resolve.
  domain_tags: [lineage, data-model, governance]
  related_terms: ["Quarantine", "Effective date", "Canonical"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §6"]

- term: County at permit
  aliases: ["County code at permit"]
  highlightable: false
  short_definition: >-
    The county a well was permitted in, frozen at permit time and carried inside its API number.
  expanded_definition: >-
    Digits 3-5 of the API-10 are this county, and they stay what they were on the day the
    permit was filed. A lateral routinely crosses a county line, counties get re-drawn, and a
    well can be re-permitted, so grouping production by this code tells you where the paperwork
    went rather than where the rock is. It is a permit fact, and it is the only county most
    free regulator files publish.
  domain_tags: [identity, geospatial]
  related_terms: ["API-10 / API-12 / API-14", "PLSS"]
  source_refs: ["canonical.wells.county_code_at_permit", "SB-08 §7.1 O-6"]

- term: CRS / compute CRS
  aliases: ["CRS", "Compute CRS"]
  short_definition: >-
    Coordinate reference system. Storage is always EPSG:4326; lateral length is measured
    geodesically on the WGS84 ellipsoid, and a projected metre-based CRS is used for area and
    spacing work.
  expanded_definition: >-
    The Williston basin spans UTM 13N and 14N and 97.6 percent of ND laterals lie west of 102W,
    so no single projected zone is right for the state: measuring them in UTM 14N overstated the
    fleet by 144,379 ft (fp-audit A3-F1). Lateral length is therefore geodesic on the ellipsoid
    under cr_nd_compute_crs_2, which chooses no zone. Distance maths in degrees remains a defect,
    not an approximation - which is why a shapefile's own length field, shipped in degrees, is
    never served as a length.
  domain_tags: [geospatial]
  related_terms: ["Datum", "Spacing / spacing unit"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.3"]

- term: Cum12 / cum24
  aliases: ["Cum12", "Cum24"]
  short_definition: >-
    Cumulative production over the first 12 or 24 producing months.
  expanded_definition: >-
    Reported both absolute and per 1,000 ft of lateral, because a longer well producing more
    oil is not the same claim as a better well.
  domain_tags: [production, modeling]
  related_terms: ["First production"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Datum
  short_definition: >-
    The geodetic reference frame a coordinate is expressed in - NAD27, NAD83 or WGS84.
  expanded_definition: >-
    North Dakota's GIS ships NAD83 (EPSG:4269), which is not literally WGS84. Legacy Texas
    coordinates are NAD27, and using them untransformed shifts a well by up to about 100 m,
    silently corrupting spacing. No coordinate reaches storage untransformed and unrecorded.
  domain_tags: [geospatial, quality]
  related_terms: ["CRS / compute CRS", "Conformance rule"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Declared vintage
  short_definition: >-
    The vintage the upstream publisher states for an artifact, as opposed to when glasswell
    retrieved it.
  expanded_definition: >-
    Some sources declare one and some publish undated files; where there is none, only the
    retrieval vintage exists and the surface says so rather than dating the bytes itself.
  domain_tags: [lineage, time]
  related_terms: ["Retrieval vintage", "Report vintage", "Manifest"]
  source_refs: ["blueprint-v0.6 §3.7.4", "lineage.manifests"]

- term: Derivation handle
  aliases: ["Derivation", "Derivation handles"]
  short_definition: >-
    The reference attached to every served figure that resolves to the graph of transforms
    that produced it.
  expanded_definition: >-
    Resolved through /v1/explain, a handle walks back through each derivation to the
    checksummed source manifests it terminates in. A figure without one is a naked number.
  domain_tags: [lineage, serving]
  related_terms: ["Manifest", "Naked number", "Recipe"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §12"]

- term: Determinism class
  short_definition: >-
    Whether an artifact's recipe reproduces it byte-for-byte, to a stated numeric tolerance,
    or only by way of its manifests.
  expanded_definition: >-
    Declared per derivation as D1, D2 or D3. Stating the weaker guarantee is the honest move;
    claiming byte-exactness for a pipeline that cannot deliver it is the failure this class
    exists to prevent.
  domain_tags: [lineage, governance]
  related_terms: ["Recipe", "Manifest"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §12"]

- term: Disposal well
  aliases: ["Disposal", "Injection well"]
  short_definition: >-
    A well the regulator types as taking fluid in rather than producing it out.
  expanded_definition: >-
    Membership is the regulator's own well_type code promoted through a conformance rule, not
    an interpretation: the ring is drawn over whatever status dot the well already carries,
    because injecting and being active are different facts about the same well.
  domain_tags: [identity, data-model]
  related_terms: ["Well type", "Well status", "Stream"]
  source_refs: ["cr_nd_well_type_disposal_1", "marts.nd_wells_tile"]

- term: Effective date
  short_definition: >-
    The date from which a rule, alias or reference record applies.
  expanded_definition: >-
    Reference data is effective-dated so that a past number can be re-derived under the rules
    that were in force when it was produced, rather than under today's.
  domain_tags: [lineage, time, governance]
  related_terms: ["Conformance rule", "Knowledge time"]
  source_refs: ["blueprint-v0.6 §9"]

- term: First production
  short_definition: >-
    The first month a well reports a non-zero volume.
  expanded_definition: >-
    The anchor for well vintage, for censoring in model training, and for the drilled-but-
    uncompleted proxy. A month reported as zero and a month never reported are not the same
    anchor, which is why the null meaning is carried on every row.
  domain_tags: [production, time]
  related_terms: ["Vintage (well vintage)", "Withheld", "Cum12 / cum24"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Formation
  aliases: ["Formation group", "Landing formation"]
  short_definition: >-
    A conformed rock-unit name resolved from a source-reported pool or formation label.
  expanded_definition: >-
    glasswell preserves the reported label, maps it to a lossless canonical formation, and
    separately records the reviewed peer group used by modeling. Composite or sub-threshold
    labels remain explicit rather than being forced into Bakken or Three Forks. An alias is
    not a formation top, measured depth, or inferred landing zone.
  domain_tags: [geology, conformance, modeling]
  related_terms: ["Pool", "Conformance rule"]
  source_refs: ["lineage.formation_aliases", "blueprint-v0.6 §3.0.3"]

- term: Formation alias
  aliases: ["Alias count", "Reported formation alias"]
  short_definition: >-
    A current source-reported label that resolves to one canonical formation.
  expanded_definition: >-
    Alias counts are counts of distinct current reported labels, not source rows and not a
    confidence score. Alias history is append-only and source-scoped; a correction creates a
    new effective row rather than changing an old decision.
  domain_tags: [geology, conformance, data-model]
  related_terms: ["Formation", "Conformance rule", "Source"]
  source_refs: ["lineage.formation_aliases", "SB-04 §4.7"]

- term: GOR
  aliases: ["Gas-oil ratio"]
  short_definition: >-
    Gas-oil ratio: gas volume per barrel of oil.
  expanded_definition: >-
    A derived surface, never a model target. It is computed from two streams that may have
    different null meanings in the same month, so it is only shown where both are reported.
  domain_tags: [production]
  related_terms: ["Stream", "Water cut"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Geometry provenance
  short_definition: >-
    Which kind of filed geometry a feature is: a surface hole, a bore centreline, or a survey
    trace.
  expanded_definition: >-
    The class travels on the feature and is served verbatim, so a line on the map is never
    silently promoted from a cartographic centreline to a directional survey. One well can
    carry several classes at once, which is why the classes do not sum to a well count. A
    jurisdiction that publishes no such attribute serves none rather than a guess.
  domain_tags: [geospatial, lineage, conformance]
  related_terms: ["Datum", "CRS / compute CRS", "Station survey", "Conformance rule"]
  source_refs: ["cr_nd_geometry_provenance_1", "cr_nm_wellhistory_geometry_provenance_1", "blueprint-v0.6 §3.0.1a"]

- term: Granularity
  short_definition: >-
    What kind of number this is: observed, allocated, modelled or assumed.
  expanded_definition: >-
    Carried on every served figure. The distinction is the product: a modelled number
    presented as an observation is the single most expensive error this system can make.
  domain_tags: [serving, quality]
  related_terms: ["Allocation / allocation v0", "Naked number"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §9.1"]

- term: Knowledge time
  short_definition: >-
    When the system learned a fact, as distinct from when the fact happened.
  expanded_definition: >-
    In glasswell the knowledge-time axis is the report vintage, taken from the manifest that
    the bytes arrived in. A restatement moves a value forward in knowledge time while leaving
    its valid time untouched.
  domain_tags: [lineage, time]
  related_terms: ["Valid time", "Report vintage", "Bitemporal"]
  source_refs: ["SB-07 §12", "DIR-2"]

- term: Land unit
  short_definition: >-
    The canonical container for a legal land subdivision: a PLSS section or township in ND and
    NM, a survey or abstract in TX.
  expanded_definition: >-
    The abstraction that keeps Texas from being a schema migration. North Dakota reports bare
    township and range numbers with no direction letters; the state lies wholly north and west
    of the fifth principal meridian, so the letters are supplied by a recorded rule.
  domain_tags: [geospatial, data-model]
  related_terms: ["PLSS", "Spacing / spacing unit"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Lateral
  aliases: ["Laterals", "Lateral bore"]
  short_definition: >-
    The horizontal section of a wellbore, and the bore centreline geometry a regulator files
    for it.
  expanded_definition: >-
    Lateral length normalises nearly every performance figure here, so what it is measured
    from matters: the filed centreline is cartography, not a directional survey, and the two
    are drawn as separate layers for that reason.
  domain_tags: [geospatial, completion]
  related_terms: ["Wellbore", "Station survey", "Spacing / spacing unit"]
  source_refs: ["blueprint-v0.6 §9", "cr_tx_lateral_bounds_1", "marts.nd_laterals_tile"]

- term: Lineage
  short_definition: >-
    The recorded chain from a served figure back to the checksummed bytes it came from.
  expanded_definition: >-
    Its layer holds the derivations, the recipes that regenerate them, the manifests that
    terminate them and the append-only audit stream over the lot. Nothing serves a number
    whose chain is missing; that is the naked-number rule stated from the other end.
  domain_tags: [lineage, data-model]
  related_terms: ["Derivation handle", "Manifest", "Recipe", "Audit stream"]
  source_refs: ["blueprint-v0.6 §4C", "lineage.derivations"]

- term: Liquids policy
  short_definition: >-
    The stated rule for what counts as the modelling liquid.
  expanded_definition: >-
    glasswell's is oil plus condensate, with the regulator's own classification preserved in
    staging. Stating it is what makes a liquids figure comparable across states that classify
    the same barrel differently.
  domain_tags: [production, governance]
  related_terms: ["Condensate", "Stream", "Conformance rule"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Manifest
  aliases: ["Manifests"]
  short_definition: >-
    The record of one retrieved raw artifact: source URL, retrieval timestamp, vintages, byte
    length and SHA-256.
  expanded_definition: >-
    The terminal node of every lineage chain. Two fetches of identical bytes reconcile to one
    manifest; changed bytes open a new one that supersedes the last, which is how a restatement
    becomes visible instead of overwriting history.
  domain_tags: [lineage]
  related_terms: ["Raw zone", "Derivation handle", "Report vintage"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §2"]

- term: Marts
  aliases: ["Mart"]
  short_definition: >-
    The serving layer: features, forecasts, valuations, tiles and rollups, all derived from
    canonical only.
  expanded_definition: >-
    Marts never ingest. They are rebuilt rather than appended to, which is why the append-only
    guarantee that covers canonical observations deliberately does not cover them.
  domain_tags: [data-model, serving]
  related_terms: ["Canonical", "Staging"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.5"]

- term: Mcf
  aliases: ["MCF"]
  short_definition: >-
    Thousand cubic feet of gas, at the regulator's stated conditions.
  expanded_definition: >-
    glasswell records the conditions rather than silently normalizing them, because the
    normalization factor differs by state and an unstated one turns a unit into an assumption.
  domain_tags: [production, quality]
  related_terms: ["Stream", "Conformance rule"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.3"]

- term: Naked number
  short_definition: >-
    A served figure with no derivation handle.
  expanded_definition: >-
    Treated as a defect and detected by a CI check rather than by review, because a rule that
    depends on a reviewer noticing is a rule that erodes.
  domain_tags: [serving, governance]
  related_terms: ["Derivation handle", "Granularity"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §12"]

- term: Operator of record
  aliases: ["Operator", "Operator name reported"]
  highlightable: false
  short_definition: >-
    The company the regulator lists as responsible for the well, spelled the way that source
    spelled it.
  expanded_definition: >-
    Served exactly as reported, because tidying the name is a cross-source mapping decision and
    those are conformance rules with rationales, not string edits inside a parser. So one
    company appears under several spellings until a rule joins them, and filtering by operator
    counts filings rather than corporate parents - an acquisition, a name change and a
    subsidiary all read as separate operators here until the join is recorded.
  domain_tags: [identity, data-model]
  related_terms: ["Conformance rule", "Canonical", "Spine"]
  source_refs: ["canonical.wells.operator_name_reported", "SB-08 §7.1 O-6"]

- term: Owner
  highlightable: false
  short_definition: >-
    The role that administers a deployment: accounts, keys, sessions and every other
    owner-scoped operation.
  expanded_definition: >-
    There are two roles and no others. An owner may create accounts, change roles, reset
    passwords, disable accounts and revoke any session; a viewer may do none of those. The last
    enabled owner cannot be demoted or disabled, because a deployment with no enabled owner
    cannot be administered at all. Accounts exist because an owner made them - there is no
    self-registration path and no reset by email.
  domain_tags: [governance, identity]
  related_terms: ["Role", "Viewer", "Session"]
  source_refs: ["SB-06 §5", "SB-04 §3"]

- term: Peer ladder
  aliases: ["Fallback level", "Peer fallback"]
  short_definition: >-
    The closed sequence of peer definitions a type-curve control tries, in order, until one
    has enough wells.
  expanded_definition: >-
    formation_area_length, then formation_area, then formation_basin, then control_unavailable.
    A rung is taken only if it holds at least the minimum peer count inside the vintage window;
    pad mates are excluded and peers are drawn only from the training and calibration arms, so
    the subject cannot be its own comparison. The rung is the peer assumption in force, which
    is why it is served on every row rather than left in the build log: two subjects under one
    column name and two different rungs are two different quantities. Recorded as
    cr_tc_peer_ladder_1.
  domain_tags: [modeling, quality]
  related_terms: ["Type curve", "Analog", "Training support"]
  source_refs: ["blueprint-v0.6 §9", "cr_tc_peer_ladder_1"]

- term: Pipeline stage
  aliases: ["Stage"]
  highlightable: false
  short_definition: >-
    Which of parse, validate, conform, join or schedule a rule runs at, or a rejected row
    failed at.
  expanded_definition: >-
    Parse, validate, conform and join are ordered and a row only reaches one by clearing the
    ones before it, so for a rejected row the stage is a measure of how far the data got:
    parse means the bytes would not read at all, join means the row was well-formed and still
    could not be tied to a well. It is the first thing to group a quarantine backlog by,
    because the repair is a different job at each stage - a parse failure is usually one file,
    a join failure is usually one rule. Schedule sits outside that order and no row passes
    through it: it is the stage a cadence decision is filed under, because deciding how often
    to poll a source is a decision about the pipeline rather than a step inside it.
  domain_tags: [lineage, quality]
  related_terms: ["Conformance rule", "Quarantine", "Staging", "Scheduled job"]
  source_refs: ["SB-07 §6.2", "migration 005_conformance.sql", "migration 007_quarantine.sql"]

- term: PLSS
  aliases: ["Public Land Survey System"]
  short_definition: >-
    The township, range and section grid used in North Dakota and New Mexico.
  expanded_definition: >-
    Texas has none, which is why inventory work is scoped to PLSS states first and why the
    land unit is an abstraction rather than a section number.
  domain_tags: [geospatial]
  related_terms: ["Land unit"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Play
  aliases: ["Plays", "Shale play"]
  short_definition: >-
    A named productive interval mapped as an outline, sitting inside a basin and never
    standing in for one.
  expanded_definition: >-
    A basin and a play are different objects, so they are promoted from different tiles and
    drawn as different rows. A play outline is a published boundary, not a formation top and
    not a claim about any particular well.
  domain_tags: [geology, data-model]
  related_terms: ["Basin", "Formation"]
  source_refs: ["cr_eia_boundary_taxonomy_1", "marts.basin_boundaries_tile"]

- term: Pool
  aliases: ["Well completion pool", "Reservoir pool"]
  highlightable: false
  short_definition: >-
    The producing reservoir interval a completion is assigned to by the regulator.
  expanded_definition: >-
    A well completed in two pools files one row per pool per month, and each of those is its
    own entity keyed on the well and the pool rather than on the well alone. The well-level
    series is the disclosed sum of those rows with the aggregation stated; the pool rows are
    what the sum was taken over. Read the two together without noticing the difference and a
    well is either double-counted or shown at half its production, depending on which side you
    started from.
  domain_tags: [production, identity, data-model]
  related_terms: ["Granularity", "Spine", "Stream"]
  source_refs: ["canonical.well_completions", "SB-01 E5"]

- term: Producing class
  highlightable: false
  short_definition: >-
    Whether a well actually filed production in a stated window: producing, not producing, or
    not known.
  expanded_definition: >-
    A different question from the status the regulator publishes, and deliberately worded so
    the two never merge: a well the regulator calls inactive can still be producing. Water is
    served but never counts. Not known is an absence of filings, which is not a filed zero.
  domain_tags: [production, conformance]
  related_terms: ["Well status", "Stream", "Liquids policy"]
  source_refs: ["cr_producing_evidence_1", "cr_producing_streams_1", "cr_producing_window_1"]

- term: Production month
  aliases: ["pm"]
  highlightable: false
  short_definition: >-
    The month a volume is attributed to - when the oil came out of the ground, not when anyone
    said so.
  expanded_definition: >-
    Every production row carries two dates answering two different questions, and this is the
    valid-time one. The other is the report vintage, the knowledge date the regulator published
    it on. A single production month therefore has as many values as it has restatements, and
    all of them are correct at their own vintage - which is why an axis of production months
    means nothing until the vintage it was read at is stated beside it.
  domain_tags: [production, time]
  related_terms: ["Report vintage", "Valid time", "Bitemporal", "Restatement"]
  source_refs: ["canonical.production.production_month", "DIR-2"]

- term: Quantile convention
  aliases: ["P10 / P50 / P90", "Statistical ascending"]
  short_definition: >-
    Which end of a distribution a quantile label names. glasswell serves
    statistical-ascending quantiles: p10 is the low case.
  expanded_definition: >-
    Every served band reads p10 < p50 < p90 by value, so p10 is the pessimistic case and p90
    the optimistic one. This is the opposite of the reserves convention a petroleum engineer
    reads by default, in which P10 is the high case and P90 the low one. The two conventions
    invert the reader's conclusion rather than blurring it, so the convention in force rides on
    every response as quantile_convention and is recorded as cr_tc_quantile_convention_1.
  domain_tags: [modeling, quality]
  related_terms: ["Band", "Type curve", "Naked number"]
  source_refs: ["cr_tc_quantile_convention_1"]

- term: Quarantine
  aliases: ["Quarantined"]
  short_definition: >-
    The table of rows that failed promotion, with the reason code, the rule that rejected them,
    the raw payload and a lifecycle state.
  expanded_definition: >-
    It has an endpoint, because the kitchen is the product. A zero quarantine rate is read as
    evidence that the checks are not running, not as evidence that the data is clean.
  domain_tags: [quality, lineage]
  related_terms: ["Conformance rule", "Audit stream"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §12"]

- term: Identity scheme
  aliases: ["Identity scheme"]
  short_definition: >-
    Which well identifier a jurisdiction's rows are keyed by - API-10 in the United States,
    UWI in Canada.
  expanded_definition: >-
    Registered per jurisdiction rather than assumed, because a scheme that is assumed is a
    scheme that silently takes the first two characters of something that is not an API-10.
    Whether the identifier is a *key* is a separate fact and its own flag: a handful of states
    reissue API-10s, which makes the number an identifier but not a unique one.
  domain_tags: [identity, data-model]
  related_terms: ["API-10 / API-12 / API-14", "Jurisdiction", "Spine"]
  source_refs: ["blueprint-v0.6 §3.0", "R8"]

- term: Jurisdiction
  aliases: ["Jurisdiction", "Jurisdictions"]
  short_definition: >-
    A regulator's territory as glasswell registers it: a state or a province, with the rules
    and the identity scheme its data is read under.
  expanded_definition: >-
    A registration, not a project. Every jurisdiction is a row in lineage.jurisdictions with a
    rationale and two dates - the date it takes effect and the date glasswell published it -
    and every cross-source decision it carries is a row beside it rather than a branch in code.
    Serving a fifth jurisdiction is appending rows; it is not editing the routers that read
    them. The word is deliberately not "state": a province is not one, and `state` is already
    both a lifecycle value and a query parameter meaning the API prefix.
  domain_tags: [data-model, conformance]
  related_terms: ["Conformance rule", "Regulator", "Identity scheme"]
  source_refs: ["blueprint-v0.6 §3.0", "R8"]

- term: Regulator
  short_definition: >-
    The agency whose filings a jurisdiction is served from, named on the registration with
    the address it publishes them at.
  expanded_definition: >-
    Named rather than implied, because "North Dakota says" is a claim about a specific agency
    and a specific publication, and a reader checking a figure needs to reach the second one.
    The regulator axis is not the coverage axis: a federal dataset covering one state is
    registered as that state's coverage and has no regulator here.
  domain_tags: [conformance, data-model]
  related_terms: ["Jurisdiction", "Source", "Conformance rule"]
  source_refs: ["blueprint-v0.6 §3.0", "R8"]

- term: Quarantine state
  highlightable: false
  short_definition: >-
    Where a rejected row stands: open, released, accepted_loss or superseded.
  expanded_definition: >-
    A rejected row is never deleted, so this is how the backlog gets worked rather than
    cleared. Released means a later rule resolved the row and it was promoted after all;
    accepted_loss is a deliberate decision to leave data on the floor, and it is the one state
    that should be read as a claim about the product; superseded means the source itself
    replaced the row. Counting open alone understates what was rejected and overstates what
    was fixed.
  domain_tags: [quality, governance]
  related_terms: ["Quarantine", "Conformance rule", "Restatement"]
  source_refs: ["SB-07 §8", "migration 007_quarantine.sql"]

- term: Raw zone
  short_definition: >-
    The immutable, content-addressed store of source bytes exactly as retrieved.
  expanded_definition: >-
    Never modified, never deleted; the payload and its directory are sealed read-only once the
    manifest is written. It is the only irreplaceable asset in the system, because a regulator
    can and does replace a file upstream.
  domain_tags: [lineage]
  related_terms: ["Manifest", "Restatement"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §2.3"]

- term: Recipe
  short_definition: >-
    The pinned instructions that regenerate an artifact: code revision, lockfile hash, entry
    point, parameters, input ids, seed and determinism class.
  expanded_definition: >-
    A recipe is what turns "we can explain this number" into "we can produce it again". It is
    recorded at derivation time, not reconstructed afterwards from whatever the tree looks like
    later.
  domain_tags: [lineage, governance]
  related_terms: ["Determinism class", "Derivation handle"]
  source_refs: ["blueprint-v0.6 §9", "SB-07 §12"]

- term: Report vintage
  short_definition: >-
    When a value was reported, as distinct from the month it describes.
  expanded_definition: >-
    A restatement is a new vintage, never an edit. The vintage is taken from the manifest that
    carried the bytes, so it is a property of the retrieval rather than of the clock the
    pipeline happened to run on.
  domain_tags: [lineage, time]
  related_terms: ["Knowledge time", "Bitemporal", "Restatement", "Vintage (well vintage)"]
  source_refs: ["blueprint-v0.6 §9", "DIR-2"]

- term: Retrieval vintage
  aliases: ["Artifact retrieved"]
  short_definition: >-
    When glasswell fetched an artifact, as opposed to the vintage its publisher declared.
  expanded_definition: >-
    Recorded on every manifest, and the only vintage available for a source that publishes
    undated files. It dates the bytes in hand, never the facts inside them.
  domain_tags: [lineage, time]
  related_terms: ["Declared vintage", "Manifest", "Raw zone"]
  source_refs: ["blueprint-v0.6 §3.7.4", "lineage.manifests"]

- term: Restatement
  short_definition: >-
    A regulator revising previously published production.
  expanded_definition: >-
    Universal, not exceptional. Texas states there is no point beyond which corrections may not
    be filed; North Dakota's spreadsheet and PDF of the same month disagree because of
    amendments; New Mexico's amendments destructively replace the prior file upstream.
  domain_tags: [lineage, time, quality]
  related_terms: ["Report vintage", "Bitemporal", "Raw zone"]
  source_refs: ["blueprint-v0.6 §9", "DIR-2"]

- term: Role
  highlightable: false
  short_definition: >-
    What an account may do: owner or viewer.
  expanded_definition: >-
    The role is the user-facing concept and it is carried by the account, not by the screen.
    Internally it resolves to a scope, which is what every authorization guard reads, so a role
    change takes effect on the account's next request rather than on its next sign-in.
  domain_tags: [governance, identity]
  related_terms: ["Owner", "Viewer", "Session"]
  source_refs: ["SB-06 §5", "SB-04 §3"]

- term: Rule kind
  highlightable: false
  short_definition: >-
    What a conformance rule does - unit_conform, vocab_map, alias_join, datum_transform,
    key_composite, parse_directive, validity_filter or code_ref.
  expanded_definition: >-
    The kind is the executor, so it says how to read the rule's spec and what a failure at that
    rule means. code_ref is the honest exception: the decision is recorded as a row and carried
    out by named code, which keeps a policy reviewable where an executable spec could not
    express it. A registry that was all code_ref would be a mapping living in code, wearing a
    row for cover.
  domain_tags: [lineage, data-model, governance]
  related_terms: ["Conformance rule", "Datum", "Canonical"]
  source_refs: ["SB-07 §6.2", "migration 005_conformance.sql"]

- term: Schema head
  aliases: ["Schema version"]
  short_definition: >-
    The migration the deployed database is currently at.
  expanded_definition: >-
    Reported as identity rather than as a measurement: it says which shape the data is in, so
    a restore or a mid-deploy read can be checked against the code that expects it.
  domain_tags: [operations, lineage]
  related_terms: ["Status snapshot", "Recipe"]
  source_refs: ["blueprint-v0.6 §3.7.7", "glasswell.status.models.PlatformStatus"]

- term: Scope label
  aliases: ["Ingest scope", "Scope tag"]
  short_definition: >-
    The basin string on a well row: which slice the ingest took, not a finding about where the
    well is.
  expanded_definition: >-
    `canonical.wells.basin` exists because the compute-CRS registry needs a basin to pick a
    projection, so every well in a scoped extract carries the scope's name - `permian` on all
    359,421 Texas rows, `williston` on all 43,817 North Dakota ones - whether or not a
    published boundary agrees. The card keeps it beside the polygon answer and marks whether
    the two agree, rather than overwriting it, because the disagreement is itself a finding.
  domain_tags: [geospatial, data-model]
  related_terms: ["Basin", "Conformance rule"]
  source_refs: ["cr_tx_basin_context_1", "cr_mt_basin_scope_1", "marts.well_basin_context"]

- term: Section (PLSS)
  highlightable: false
  aliases: ["Section", "Sections", "PLSS section"]
  short_definition: >-
    The one-square-mile subdivision of a PLSS township, and the finest land unit the grid
    draws.
  expanded_definition: >-
    Sections are the cell most rollups bin on, which is why which section a well belongs to is
    a recorded rule rather than a convenience: a lateral's midpoint and its surface hole
    routinely fall in different ones.
  domain_tags: [geospatial, data-model]
  related_terms: ["PLSS", "Township", "Land unit"]
  source_refs: ["blueprint-v0.6 §9", "cr_blm_plss_publisher_1", "marts.land_units_tile"]
- term: Session
  highlightable: false
  short_definition: >-
    A signed-in browser, held server-side as a row and presented as a cookie.
  expanded_definition: >-
    The cookie carries a token; the database holds only its sha256, so a stolen backup does not
    yield a working credential. Every request re-reads the row, which is what makes revocation
    take effect on the next request rather than at the next expiry. Two windows end a session
    on their own: an idle window that slides on use, and an absolute cap that never moves.
  domain_tags: [governance, identity]
  related_terms: ["Role", "Owner", "Viewer"]
  source_refs: ["SB-06 §5", "SB-04 §3"]

- term: Slot
  highlightable: false
  short_definition: >-
    A geometrically admissible undrilled lateral position at an assumed spacing.
  expanded_definition: >-
    Never a reserve, a resource, or a booked location. A slot ships only with its training
    support stated, because geometry alone cannot say whether a position is worth drilling.
  domain_tags: [modeling]
  related_terms: ["Spacing / spacing unit", "Training support"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Source
  aliases: ["Source id", "Source layer"]
  highlightable: false
  short_definition: >-
    One upstream publication - a specific regulator file or feed - under a stable id.
  expanded_definition: >-
    The source id is the join key for most of the kitchen: manifests record whose bytes were
    fetched, conformance rules are declared against one source, quarantined rows name the
    source they were read from, and freshness is measured per source rather than for the system
    as a whole. Two files from one agency are two sources when they are published separately,
    because they go stale separately and a single freshness number would hide the older one.
  domain_tags: [lineage, data-model]
  related_terms: ["Manifest", "Raw zone", "Conformance rule"]
  source_refs: ["lineage.sources", "SB-08 §7.1 O-6"]

- term: Spacing / spacing unit
  aliases: ["Spacing", "Spacing unit", "Spacing units"]
  short_definition: >-
    The distance between parallel laterals, and the regulator-defined area within which wells
    producing from a pool are allocated.
  expanded_definition: >-
    Both are computed in the projected CRS. Computing either in degrees produces a number that
    looks plausible and is wrong by a factor that varies with latitude.
  domain_tags: [geospatial]
  related_terms: ["CRS / compute CRS", "Land unit"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Spine
  highlightable: false
  short_definition: >-
    The identity backbone a schema joins on; glasswell's is API-10.
  expanded_definition: >-
    Every table that describes a well keys on it, which is why the identity question - does a
    source carry API-10 at all - is answered before any of that source's data is promoted.
  domain_tags: [identity, data-model]
  related_terms: ["API-10 / API-12 / API-14", "Wellbore"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Split set
  aliases: ["sset", "Temporal split bundle"]
  short_definition: >-
    The content-addressed identity of the rolling-origin train, calibration and test splits a
    model artifact was built on.
  expanded_definition: >-
    An sset_ id addresses the whole bundle of persisted splits — every rolling origin and every
    horizon in it — so two artifacts carrying the same split set were evaluated on the same held
    out wells and are comparable, and two carrying different ones are not. All three streams
    share one bundle because the split is a decision about wells and time, not about what was
    produced. Each individual split also carries its own hash, so a served figure names both the
    bundle and the split that produced it.
  domain_tags: [modeling, lineage]
  related_terms: ["Type curve", "Knowledge time", "Recipe"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Spud date
  highlightable: false
  short_definition: >-
    The day drilling started on a well, as reported.
  expanded_definition: >-
    Not first production - the gap between the two is months, and using one for the other
    misdates a whole well vintage. It is also among the fields most often missing or later
    corrected in a permit file, so an empty spud date means the regulator published none, not
    that the well was never drilled. Any cohort built on spud dates inherits both problems and
    should say which vintage it read them at.
  domain_tags: [identity, time]
  related_terms: ["First production", "Vintage (well vintage)", "Restatement"]
  source_refs: ["canonical.wells.spud_date", "SB-08 §7.1 O-6"]

- term: Staging
  short_definition: >-
    The source-faithful layer: one schema per regulator file type, no opinions, rejects to
    quarantine.
  expanded_definition: >-
    Every column is text, because coercing a value is already an interpretation and staging
    exists to hold what arrived. Staging never serves.
  domain_tags: [data-model]
  related_terms: ["Canonical", "Quarantine", "Marts"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.4.2"]

- term: Station survey
  aliases: ["Survey trace", "Survey traces", "survey_trace", "Directional survey"]
  short_definition: >-
    A bore path reported as measured stations - depth, inclination, azimuth, true vertical
    depth - rather than as a single header.
  expanded_definition: >-
    The drawn trace is those stations joined, so it is the one line on the map that is a
    survey. A filed bore centreline is not, and confusing the two overstates how precisely a
    wellbore's position is known.
  domain_tags: [geospatial, identity]
  related_terms: ["Wellbore", "Lateral", "Datum"]
  source_refs: ["blueprint-v0.6 §9", "cr_nd_survey_min_stations_1"]

- term: Status snapshot
  aliases: ["Snapshot", "Snapshots"]
  short_definition: >-
    One timed reading of the platform's own state, which every figure on the status surface is
    taken from.
  expanded_definition: >-
    A stale or unreadable snapshot suppresses successful-looking values rather than showing
    them: an old green check is worse than no check. Each reading states when it was observed,
    and a component with no probe is listed as not instrumented rather than omitted.
  domain_tags: [operations, serving]
  related_terms: ["Timer", "Manifest", "Derivation handle"]
  source_refs: ["blueprint-v0.6 §3.7.7", "glasswell.status.models.StatusSnapshot"]

- term: Stream
  highlightable: false
  short_definition: >-
    Oil, gas, water or condensate - the substance a volume measures.
  expanded_definition: >-
    North Dakota's monthly report also carries gas sold and gas flared. Those are dispositions
    of produced gas rather than streams, so they are recorded and measured but not promoted as
    production.
  domain_tags: [production, data-model]
  related_terms: ["Condensate", "Mcf", "Liquids policy"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Timer
  aliases: ["Timers"]
  short_definition: >-
    The registered schedule that starts a job. Armed means the schedule exists, never that the
    last run succeeded.
  expanded_definition: >-
    Scheduling is systemd timers against a jobs table rather than a workflow engine, so the
    two facts a reader needs are separate: whether the schedule is installed, and whether the
    platform persisted a run. Run times are reported only where they were actually recorded.
  domain_tags: [operations, governance]
  related_terms: ["Cadence", "Status snapshot", "Scheduled job", "Observing"]
  source_refs: ["blueprint-v0.6 §3.1", "blueprint-v0.6 §3.7.7"]

- term: Scheduled job
  aliases: ["Scheduled jobs"]
  short_definition: >-
    One registered command, with the sources it polls, what it waits on, and the rule that
    decided how often it runs.
  expanded_definition: >-
    A job is one runnable command, which is what keeps its memory ceiling, its timeout, its
    transient unit and its run history one-to-one with a process. Registering a source is not
    the same act as scheduling it, and the registry is where the difference shows: a source
    with a poll interval and no job over it has a cadence nobody executes. Adding a job is
    rows, never a unit file.
  domain_tags: [operations, governance, data-model]
  related_terms: ["Cadence", "Timer", "Next due", "Refusal", "Observing"]
  source_refs: ["lineage.scheduled_jobs", "lineage.job_schedules"]

- term: Next due
  short_definition: >-
    When a job is next asked to run, computed from the same freshness rule the health page
    reads.
  expanded_definition: >-
    Due is derived, never stored: an interval job is due when the source it polls is past its
    expected next poll, and a monthly job is due once the calendar day it names has passed
    without a run since. A job that waits on another job has no next-due instant at all,
    because the event it waits on has not happened yet; the page says so with the cadence note
    rather than serving a guess.
  domain_tags: [operations, time]
  related_terms: ["Cadence", "Scheduled job", "Timer"]
  source_refs: ["lineage.job_schedules", "lineage.source_poll_policies"]

- term: Refusal
  aliases: ["Refused", "Refusal code"]
  short_definition: >-
    A recorded reason a job did not run, in one of three severity classes.
  expanded_definition: >-
    Refused, failed and interrupted are three different facts and collapsing them is exactly
    the silence the conformance rule forbids. A refusal carries a code, and the code's class is
    a registered row rather than a list in the page: informational means a standing condition
    an operator already knows about, waiting means it will resolve on its own, and fault means
    something needs attention. That is why an owner-triggered job does not redden a deploy.
  domain_tags: [operations, governance]
  related_terms: ["Scheduled job", "Observing", "Status snapshot"]
  source_refs: ["lineage.refusal_codes", "lineage.job_runs"]

- term: Observing
  aliases: ["Observe", "Observing mode"]
  short_definition: >-
    A job whose plan is computed and recorded, while the unit that has always run it still
    does.
  expanded_definition: >-
    Observing is a property of each schedule row, not a posture stated in prose: the row says
    observe, the tick records what it would have run, and nothing is launched. It is how the
    schedule is proved right against the timers it will replace before it replaces them, and
    turning a job over is appending one row rather than changing code.
  domain_tags: [operations, governance]
  related_terms: ["Scheduled job", "Timer", "Refusal"]
  source_refs: ["lineage.job_schedules"]

- term: Township
  aliases: ["Townships", "Township-range"]
  short_definition: >-
    The six-mile-square PLSS unit that holds thirty-six sections, addressed by township and
    range.
  expanded_definition: >-
    The coarser of the two grid units glasswell draws and bins on. Which publisher's version
    of the grid is promoted is a recorded decision, because published township geometry
    differs measurably between publishers.
  domain_tags: [geospatial, data-model]
  related_terms: ["PLSS", "Section (PLSS)", "Land unit"]
  source_refs: ["blueprint-v0.6 §9", "cr_blm_plss_publisher_1", "marts.land_units_tile"]

- term: Training support
  short_definition: >-
    How densely the training data covers the point being predicted, on a stated 0-1 scale with
    its k and metric declared.
  expanded_definition: >-
    A gate: no slot and no scenario ships without it. The earlier name for this measure is
    retired, so that a single number is not reported under two names with two meanings.
  domain_tags: [modeling, quality]
  related_terms: ["Slot", "Analog", "Band"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Type curve
  short_definition: >-
    An aggregate production profile for a group of comparable wells.
  expanded_definition: >-
    The industry-standard baseline, and glasswell's mandatory control group for every accuracy
    claim a model makes. A model that cannot beat it does not ship on the strength of being a
    model.
  domain_tags: [modeling]
  related_terms: ["Band", "Analog"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Valid time
  short_definition: >-
    When a fact was true in the world, as distinct from when the system learned it.
  expanded_definition: >-
    For production, valid time is the production month the regulator reported against. It never
    changes; a correction changes what is known about that month, not which month it was.
  domain_tags: [lineage, time]
  related_terms: ["Knowledge time", "Bitemporal", "Report vintage"]
  source_refs: ["SB-07 §12", "DIR-2"]

- term: Viewer
  highlightable: false
  short_definition: >-
    The role that reads this deployment and administers nothing in it.
  expanded_definition: >-
    A viewer reaches every read surface and no owner-scoped one: not accounts, not keys, not
    the session list. A viewer may end their own session and change their own password, which
    are operations about the caller rather than about the deployment.
  domain_tags: [governance, identity]
  related_terms: ["Role", "Owner", "Session"]
  source_refs: ["SB-06 §5", "SB-04 §3"]
- term: Viewport
  aliases: ["Map view"]
  short_definition: >-
    The map's current visible extent and zoom. It selects what is drawn, never what a figure
    is computed from.
  expanded_definition: >-
    A number that changes when you pan is not reproducible, so where a count is scoped to the
    view it says so and can be switched off. What the canvas drew and what the box holds are
    reported as two answers, never reconciled into one.
  domain_tags: [geospatial, serving]
  related_terms: ["Basemap", "Naked number"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Vintage (well vintage)
  aliases: ["Well vintage", "Vintage"]
  highlightable: false
  short_definition: >-
    The year or period a well was completed.
  expanded_definition: >-
    Distinct from report vintage; both appear in this system and the glossary keeps them apart
    deliberately, because a chart that mixes them looks like a trend and is an artefact.
    glasswell keys its North Dakota vintage cohorts on the spud year rather than the completion
    year, because spud dates cover 84 percent of the ND population against the completion
    anchor's 40 percent and reach back to 1922 rather than to 2009, which is when the disclosure
    registry began rather than when the basin was drilled. That choice is
    cr_nd_vintage_cohort_1, with its measured rationale; the completion anchor is still served
    per well at /v1/wells/{api10}/completions, it is simply not the cohort key.
  domain_tags: [production, time]
  related_terms: ["Report vintage", "First production", "Spud date"]
  source_refs: ["blueprint-v0.6 §9", "cr_nd_vintage_cohort_1"]

- term: Fluid intensity
  aliases: ["Base fluid intensity", "Fluid per lateral foot"]
  highlightable: false
  short_definition: >-
    Base fluid pumped per foot of lateral, in US gallons per foot.
  expanded_definition: >-
    The disclosed total base water volume divided by the well's summed lateral length. It is a
    completion-design figure, not a production one: a bigger number means a larger job, never a
    better well. Both operands come from different sources measured at different times - the
    volume from a voluntary FracFocus disclosure under cr_ff_base_water_units_1, the length
    computed geodesically from canonical geometry - so a well missing either gets a stated
    reason rather than a zero. cr_ff_fluid_intensity_1 declares the minimum lateral the division
    is defensible over and the ceiling above which the result is withdrawn.
  domain_tags: [completion, design]
  related_terms: ["Wellbore", "Completion event", "Conformance rule"]
  source_refs: ["canonical.well_completion_design", "cr_ff_fluid_intensity_1"]

- term: Cumulative production
  aliases: ["Cumulative", "Cum"]
  highlightable: false
  short_definition: >-
    The sum of a well's filed monthly volumes for one stream, over a stated span.
  expanded_definition: >-
    A total is only as complete as the record under it, so the figure is served beside the
    months that make it up: months reported, months reported as zero, months with no report, and
    months the regulator withheld. Those four are different facts and are never collapsed into
    one gap. The cumulative is a mart snapshot at a stated vintage, so the live monthly series
    can already hold months it has not absorbed; when it does, the response says so rather than
    leaving a reader to find the difference by arithmetic.
  domain_tags: [production, time]
  related_terms: ["Report vintage", "Withheld", "Liquids policy"]
  source_refs: ["marts.well_cumulatives", "blueprint-v0.6 §9"]

- term: Vocabulary rule
  aliases: ["Vocabulary", "Status vocabulary"]
  short_definition: >-
    A lookup-kind conformance rule that maps one regulator's codes onto a canonical class set.
  expanded_definition: >-
    The mapping is rows the promotion engine reads, so no code path can disagree with it, and
    every surface that shows a class names the rule that produced it. A documented code with
    no canonical counterpart is served as its own class rather than as null.
  domain_tags: [conformance, governance, data-model]
  related_terms: ["Conformance rule", "Rule kind", "Well status"]
  source_refs: ["blueprint-v0.6 §3.3 R8", "migration 005_conformance.sql", "cr_nd_status_vocab_1"]

- term: Water cut
  highlightable: false
  short_definition: >-
    Water as a share of gross produced liquids.
  expanded_definition: >-
    A derived surface, never a model target. Like the gas-oil ratio it is only shown where both
    of its inputs were actually reported.
  domain_tags: [production]
  related_terms: ["GOR", "Stream"]
  source_refs: ["blueprint-v0.6 §9"]

- term: Well name
  highlightable: false
  short_definition: >-
    The operator's name for a well - usually a lease name and a number - exactly as filed.
  expanded_definition: >-
    A label, never an identity. Names repeat across operators and basins, change when a lease
    changes hands, and differ between the permit file and the production file for the same
    hole. Joining on one is how two wells quietly become one well, and it is the reason the
    spine is API-10 - a name is for reading, a number is for joining.
  domain_tags: [identity]
  related_terms: ["API-10 / API-12 / API-14", "Spine", "Operator of record"]
  source_refs: ["canonical.wells.well_name", "SB-08 §7.1 O-6"]

- term: Well status
  aliases: ["Status canonical"]
  highlightable: false
  short_definition: >-
    The well's lifecycle state mapped to one vocabulary across states - active, plugged, dry,
    expired, inactive, confidential, permitted, drilling, temporarily_abandoned, service, or
    documented_unmapped for a code a regulator publishes and this vocabulary has no word for.
  expanded_definition: >-
    Each regulator publishes its own codes, and every mapping onto this vocabulary is a
    conformance rule with a rationale - cr_nd_status_vocab_1 in North Dakota,
    cr_tx_status_vocab_1 in Texas, cr_nm_wellhistory_status_vocab_2 in New Mexico,
    cr_mt_gis_status_vocab_1 in Montana and cr_co_wells_status_vocab_1 in Colorado - so a
    canonical status resolves to the decision that produced it. Empty is not the same as
    unknown: it means the source reported no status at all. What becomes of a code the
    vocabulary does not map is the rule's own choice: North Dakota, Texas and Montana
    quarantine it, while New Mexico and Colorado pass it through unclassed rather than drop a
    header the identity spine joins production to. documented_unmapped is a third case again -
    the regulator documents the code and glasswell has no equivalent class, which is a fact
    worth serving rather than a null; Colorado's SO and UN are that case, and so are four OCD
    letters in New Mexico.
  domain_tags: [identity, data-model]
  related_terms: ["Conformance rule", "Confidential well", "Quarantine"]
  source_refs: ["migration 010_nd_reference_seed.sql", "migration 027_tx_slice.sql"]

- term: Well type
  aliases: ["Well types", "well_type"]
  short_definition: >-
    The code a regulator files for what a well is for, served as filed and never decoded into
    a class.
  expanded_definition: >-
    Distinct from well status, which is about the permit. A code the served box does not hold
    reads absent rather than zero, and a well whose source filed no type is in no row at all
    while still counting in the total.
  domain_tags: [identity, data-model]
  related_terms: ["Well status", "Disposal well", "Conformance rule"]
  source_refs: ["cr_nd_well_type_disposal_1", "cr_nm_wellhistory_well_type_1", "marts.nd_wells_tile"]

- term: Wellbore
  highlightable: false
  short_definition: >-
    The physical hole. One API-10 may have several - an original plus sidetracks, or several
    laterals.
  expanded_definition: >-
    glasswell assumes one producing wellbore per API-10 and quarantines the exceptions rather
    than mis-joining them. In North Dakota a multi-lateral well is normal, so the geometry of
    every lateral is kept and the rate of exceptions is measured rather than assumed.
  domain_tags: [identity, geospatial]
  related_terms: ["API-10 / API-12 / API-14", "Quarantine", "Spine"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.5"]

- term: Withheld
  highlightable: false
  short_definition: >-
    Data a source deliberately does not publish, such as a confidential well's production.
  expanded_definition: >-
    A distinct state from not reported and from zero. Collapsing the three biases every quality
    metric computed over them, because withholding is not missing at random.
  domain_tags: [quality, production]
  related_terms: ["Confidential well", "First production"]
  source_refs: ["blueprint-v0.6 §9", "blueprint-v0.6 §3.0.3"]

- term: ECMC
  aliases: ["COGCC", "Colorado Energy and Carbon Management Commission"]
  short_definition: >-
    Colorado's oil and gas regulator, renamed from the COGCC and serving the same host.
  expanded_definition: >-
    The Colorado Oil and Gas Conservation Commission became the Energy and Carbon Management
    Commission; the old host 301-redirects to the new one, so a citation written under either
    name still resolves. The rename matters to a reader for one reason: the shapefile's own
    in-band status legend dates from the COGCC era and omits three codes the live reference
    list publishes, which is why cr_co_wells_status_vocab_1 says which legend governs.
  domain_tags: [governance, data-model]
  related_terms: ["Conformance rule", "Well status"]
  source_refs: ["lineage.jurisdictions", "cr_co_wells_status_vocab_1"]

- term: Facil_Stat
  short_definition: >-
    The status code ECMC files on a Colorado well, mapped onto the canonical vocabulary by
    cr_co_wells_status_vocab_1 at read time.
  expanded_definition: >-
    Thirteen codes are published for a well. Eleven map to a canonical class and two, SO and
    UN, are documented with no equivalent, so they carry documented_unmapped and the code the
    regulator filed. The class is resolved when a row is read rather than written at
    promotion, because the header refreshes daily against an append-only spine and a class
    written at promotion would invent a valid time ECMC never filed.
  domain_tags: [identity, data-model]
  related_terms: ["Well status", "ECMC", "Documented, no class"]
  source_refs: ["lineage.co_facility_status_map", "cr_co_wells_status_vocab_1"]

- term: Loc_Qual
  aliases: ["Location qualifier", "loc_qual_class"]
  short_definition: >-
    ECMC's own statement of how a Colorado coordinate was arrived at: planned, actual, or one
    it placed itself.
  expanded_definition: >-
    A different axis from geometry provenance, which says which feature a point is. This says
    how good the coordinate is, and it is the reason a Colorado point can be a permit location
    on a well that was drilled somewhere else. Nearly half of Colorado's served points are
    planned, so a map that did not carry it would be drawing permit applications as surveys.
    The class is the first word of the filed string, case-folded, under
    cr_co_wells_location_qualifier_1.
  domain_tags: [geospatial, data-model]
  related_terms: ["Geometry provenance", "ECMC", "Conformance rule"]
  source_refs: ["canonical.well_spatial.location_qualifier", "cr_co_wells_location_qualifier_1"]

- term: Well_Class
  short_definition: >-
    ECMC's code for what a Colorado well is, served exactly as filed because the publisher
    documents no vocabulary for it.
  expanded_definition: >-
    The honest counterpart to Facil_Stat. The status vocabulary turned out to be published
    after all; this one genuinely is not - the FGDC metadata record carries no Well_Class
    attribute at all - so cr_co_wells_well_type_1 serves the seventeen filed values with no
    decode and no class. Inventing one would be a mapping decision with no evidence behind it.
  domain_tags: [data-model, quality]
  related_terms: ["Well type", "ECMC", "Conformance rule"]
  source_refs: ["cr_co_wells_well_type_1", "Wells_Metadata.html"]

- term: ApiSidetrack
  aliases: ["Sidetrack code"]
  short_definition: >-
    The two-digit wellbore suffix ECMC files beside a Colorado API-10, making the filing an
    API-12.
  expanded_definition: >-
    A sidetrack is a second wellbore from one surface hole, so it is part of a well's identity
    at the production grain and not at the header grain. It is a component of the completion
    key cr_co_production_entity_key_1 builds, which is what keeps two wellbores' volumes from
    being promoted as one series or quarantined as duplicates of each other.
  domain_tags: [identity, data-model]
  related_terms: ["API-10 / API-12 / API-14", "Completion event", "Conformance rule"]
  source_refs: ["cr_co_production_entity_key_1", "canonical.well_completions"]

- term: FormationCode
  short_definition: >-
    The producing formation ECMC names on a Colorado production filing, carried as filed
    before any vocabulary mapping.
  expanded_definition: >-
    ECMC files each completion's volumes against a formation code, which is what makes
    Colorado's production per completion rather than per lease and removes the allocation
    step Texas needs. The code is stored as pool_reported, unmapped, so the pool rollup the
    well row discloses can always be read back to the codes it summed.
  domain_tags: [data-model, geology]
  related_terms: ["Completion event", "Pool", "ApiSidetrack"]
  source_refs: ["canonical.well_completions.pool_reported", "cr_co_production_grain_1"]

- term: Documented, no class
  aliases: ["documented_unmapped"]
  short_definition: >-
    A status the regulator publishes and defines, for which this vocabulary has no equivalent
    word.
  expanded_definition: >-
    Three facts are kept apart. Empty means the source filed no status. Unmapped means a code
    arrived that no rule anticipated. This is the third: the regulator documents the code, and
    glasswell declines to force it into a class it does not fit. Colorado's SO - operations
    suspended before total depth, so the well is neither drilling nor temporarily abandoned
    nor dry - is the clearest instance, and it is served with the code beside it.
  domain_tags: [data-model, quality]
  related_terms: ["Well status", "Facil_Stat", "Quarantine"]
  source_refs: ["cr_co_wells_status_vocab_1", "cr_nm_wellhistory_status_vocab_2"]

- term: Lease (TX)
  aliases: ["Lease key", "RRC lease"]
  short_definition: >-
    The unit the Railroad Commission of Texas files production against: one or more wells
    under one operator, keyed by district and lease number.
  expanded_definition: >-
    Texas reports production by lease rather than by well, so a Texas lease is the grain the
    regulator's number is true at. The key is the oil-gas code, the district number and the
    lease number together, because a bare lease number collides across districts and one
    wellbore can be completed on an oil lease and a gas lease at once. An oil lease may hold
    many wells; a gas lease holds exactly one.
  domain_tags: [production, data-model]
  related_terms: ["Allocation / allocation v0", "Allocated share", "Granularity"]
  source_refs: ["cr_tx_lease_key_1", "cr_tx_production_grain_1"]

- term: Allocated share
  aliases: ["Share", "Per-well share"]
  short_definition: >-
    One well's estimated part of a lease-level volume, computed rather than reported.
  expanded_definition: >-
    Where a lease held more than one eligible well in a month, the lease volume is divided
    equally among them and each part is that well's allocated share. It carries the class it
    was arrived at under, the count of wells it was divided among, and the id of the model
    that computed it. It is an estimate: the lease total is the fact, and the share is what
    this system is prepared to say about one well within it.
  domain_tags: [production, data-model]
  related_terms: ["Allocation / allocation v0", "Lease (TX)", "Naked number"]
  source_refs: ["cr_tx_allocation_v0_1", "cr_alloc_v0_error_bounds_1"]

- term: Casinghead gas
  aliases: ["Associated gas"]
  short_definition: >-
    Gas produced with oil from an oil well, as distinct from gas produced from a gas well.
  expanded_definition: >-
    The Railroad Commission files it in its own column, separately from gas-well gas, and the
    two are disjoint populations keyed by whether the lease is an oil or a gas lease. A Texas
    gas figure is the sum of both, because omitting casinghead gas would under-report the
    Permian's associated gas, which is most of it. Gas put back down the hole for lift is
    injection and is never summed in.
  domain_tags: [production]
  related_terms: ["Stream", "Lease (TX)"]
  source_refs: ["cr_tx_gas_basis_1"]

- term: Production completeness lag
  aliases: ["Completeness lag", "Incomplete window"]
  short_definition: >-
    The months at the end of a series that are systematically under-filed because reports are
    still arriving.
  expanded_definition: >-
    The Railroad Commission states that production records are substantially complete after
    about six months, so the last six months of a Texas chart are not a decline: they are a
    filing window that has not closed. Those months are shaded and the series carries a warning
    naming the first of them, because distinguishing a filed zero from an unfiled month is
    necessary and not sufficient - a reader sees a shape, not a count.
  domain_tags: [production, quality]
  related_terms: ["Report vintage", "Allocation / allocation v0"]
  source_refs: ["cr_tx_production_grain_1"]
