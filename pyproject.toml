[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasswell"
version = "0.74"
description = "Glass-box upstream analytics on public data"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ryan MacDonald", email = "ryan@rfxn.com" }]
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "orjson>=3.10",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyshp>=2.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "PyYAML>=6.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
glasswell-migrate = "glasswell.db.migrate:main"
glasswell-owner-bootstrap = "glasswell.api.bootstrap:bootstrap_main"
glasswell-owner-reset = "glasswell.api.bootstrap:reset_main"
glasswell-features = "glasswell.modeling.feature_matrix:main"
glasswell-model-dataset = "glasswell.modeling.model_dataset:main"
glasswell-typecurve-control = "glasswell.modeling.type_curve:main"
glasswell-p3-context-publish = "glasswell.modeling.p3_publication:main"
glasswell-neighbors = "glasswell.marts.neighbors:main"
glasswell-fracfocus = "glasswell.ingest.fracfocus:main"
glasswell-eia-boundaries = "glasswell.ingest.eia_boundaries:main"
glasswell-basin-boundaries = "glasswell.marts.basin_boundaries:main"
glasswell-mt-bogc = "glasswell.ingest.mt_bogc:main"
glasswell-mt-gis = "glasswell.ingest.mt_gis:main"
# Tier 2 of the New Mexico track only. `glasswell.ingest.nm_ocd` and `.nm_dims` deliberately
# keep their `python -m` spelling: docs/runbook-nm-tier2.md states why.
glasswell-nm-wells = "glasswell.ingest.nm_wells:main"
glasswell-nm-tiles = "glasswell.marts.nm_wells:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glasswell.db" = ["migrations/*.sql"]
"glasswell.modeling" = ["p3_context_baseline.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: pure-function tests; no database, no docker",
    "integration: requires an ephemeral PostGIS container",
    "contract: FastAPI/OpenAPI surface tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["glasswell", "tests"]

[tool.ruff.lint.per-file-ignores]
# Nested context managers are the behaviour under test where derive() nests.
"tests/**" = ["SIM117"]

[tool.coverage.run]
source = ["src/glasswell"]
